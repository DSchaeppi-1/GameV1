  return lvls;
}
function recruit(cid){
  if(G.roster.some(c=>c.companionId===cid)) return null;
  const C=COMPANIONS[cid]; const p=playerChar();
  const c = autoBuild(C.race, C.cls, p.level, {name:C.name, companionId:cid, gender:C.gender, flexAbil:C.flexAbil, portraitSeed:cid.length*1013+cid.charCodeAt(0)*7});
  c.xp = Math.max(p.xp, XP_TABLE[p.level]); c.ai = G.settings.companionAI;
  if(p.level<3){ c.equip.cloak=null; c.equip.ring1=null; c.equip.neck=null; }
  G.roster.push(c); if(G.party.length<6) G.party.push(c.uid);
  G.flags['has_'+cid]=true;
  return c;
}
function hasCompanion(cid){ return G.party.some(id=>{ const c=G.roster.find(x=>x.uid===id); return c && c.companionId===cid; }); }
function restParty(){ for(const c of G.roster) fullRest(c); }

// ---------- casting outside battle ----------
// Buffs cast here are stored on the character (c.buffs) and applied when the next battle starts.
// "Until the end of the battle" effects last through that battle; timed effects start their rounds then.
// Everything cast here is spent by the next battle or cleared by a long rest.
function oocSpellOk(sid){ const sp=SPELLS[sid]; return !!sp && ['self','ally','allies'].includes(sp.target) && !!(sp.buff||sp.heal); }
function spellLevelFor(c, sid){ const sp=SPELLS[sid]; const L=sp.lv[CLASSES[c.cls].spellList]; return L ?? Math.min(...Object.values(sp.lv).concat([9])); }
function oocOptions(c){
  const out=[]; const s=charStats(c); const r=c.res||{};
  const inf = G.dev && G.dev.infinite;
  if(CLASSES[c.cls].cast) for(const k of knownSpells(c)){
    if(!oocSpellOk(k.id)) continue;
    const ok = inf || k.lv===0 || slotFor(c,k.lv)!==null;
    out.push({key:'s:'+k.id, sid:k.id, name:SPELLS[k.id].name, target:SPELLS[k.id].target, lv:k.lv, ok, note:k.lv===0?'at will':`level ${k.lv} slot`, heal:!!SPELLS[k.id].heal});
  }
  for(const g of (s.items?.grants||[])){ if(!oocSpellOk(g.spell)) continue; const left=(r.grants||{})[g.key]??0;
    out.push({key:'g:'+g.key, sid:g.spell, name:SPELLS[g.spell].name, target:SPELLS[g.spell].target, ok:inf||left>0, note:`${itemName(g.item)} · ${left} left`, heal:!!SPELLS[g.spell].heal}); }
  if(r.lay!==undefined) out.push({key:'lay', name:'Lay on Hands', target:'ally', ok:inf||r.lay>0, note:`${r.lay}/${r.layMax} uses · heal ${Math.floor(c.level/2)}d6`, heal:true, desc:`Heal ${Math.floor(c.level/2)}d6 hit points.`});
  if(r.channel!==undefined) out.push({key:'channel', name:'Channel Energy', target:'allies', ok:inf||r.channel>0, note:`${r.channel}/${r.channelMax} uses · heal ${Math.ceil(c.level/2)}d6 to the party`, heal:true, desc:`Heal every party member ${Math.ceil(c.level/2)}d6 hit points.`});
  return out;
}
function oocTargets(c, opt, tuid){
  if(opt.target==='self') return [c];
  if(opt.target==='allies') return activeParty();
  const t=G.roster.find(x=>x.uid===tuid); return t? [t] : [];
}
function oocCast(c, key, tuid){
  const opt=oocOptions(c).find(o=>o.key===key); if(!opt || !opt.ok) return {ok:false, msg:'Nothing left to cast that with.'};
  const tg=oocTargets(c,opt,tuid); if(!tg.length) return {ok:false, msg:'Choose a target.'};
  const inf = G.dev && G.dev.infinite; const s=charStats(c); const who=c.name.split(' ')[0];
  const healTo=(t,amt)=>{ const mx=charStats(t).hpMax; const b=Math.max(0,t.hp); t.hp=Math.min(mx, b+amt); return t.hp-b; };
  if(key==='lay'){ if(!inf) c.res.lay--; const t=tg[0]; const got=healTo(t, roll(Math.max(1,Math.floor(c.level/2)),6)); return {ok:true, msg:`${who} lays hands on ${t.name.split(' ')[0]}: +${got} hp.`}; }
  if(key==='channel'){ if(!inf) c.res.channel--; const parts=tg.map(t=>`${t.name.split(' ')[0]} +${healTo(t, roll(Math.ceil(c.level/2),6))}`); return {ok:true, msg:`${who} channels positive energy: ${parts.join(', ')}.`}; }
  const sid=opt.sid, sp=SPELLS[sid]; let cl=s.cl||1;
  if(key.startsWith('g:')){ const gk=key.slice(2); if(!inf) c.res.grants[gk]--; cl=Math.max(cl, spellLevelFor(c,sid)*2+1); }
  else { const lv=opt.lv; if(lv>0 && !inf){ const sl=slotFor(c,lv); if(sl===null) return {ok:false, msg:'No spell slot left.'}; c.res.slots[sl]--; } }
  if(sp.heal){ const H=sp.heal(cl); const parts=tg.map(t=>`${t.name.split(' ')[0]} +${healTo(t, H.n?roll(H.n,H.d,H.b):H.b)}`); return {ok:true, msg:`${who} casts ${sp.name}: ${parts.join(', ')}.`}; }
  const b=sp.buff(cl);
  for(const t of tg){ t.buffs=(t.buffs||[]).filter(x=>x.id!==b.id); t.buffs.push(JSON.parse(JSON.stringify(b))); }
  const dur = b.dur==='battle'? 'until the end of the next battle' : `${b.dur} rounds once the next battle begins`;
  return {ok:true, msg:`${who} casts ${sp.name} on ${opt.target==='allies'?'the party':tg[0]===c?'themself':tg[0].name.split(' ')[0]} — lasts ${dur}.`};
}
function buffLabel(b){ return b.name + (b.dur==='battle'?'':` (${b.dur} rds)`); }

// ---------- skills ----------
function partyBest(sk){
  let best=null;
  for(const c of activeParty()){ if(c.hp<=0) continue; const b=skillBonus(c,sk); if(!best||b>best.bonus) best={c,bonus:b}; }
  return best || {c:playerChar(), bonus:skillBonus(playerChar(),sk)};
}
function skillCheck(sk, dc){
  const b=partyBest(sk); const r=d(20); const total=r+b.bonus;
  const ok = (G.dev && G.dev.autoPass) || total>=dc;
  return {ok, roll:r, bonus:b.bonus, total, who:b.c, skill:sk, dc};
}
function checkText(res){ return `${res.who.name.split(' ')[0]}'s ${SKILLS[res.skill].name}: d20 ${res.roll}${fmtMod(res.bonus)} = ${res.total} vs DC ${res.dc} — ${res.ok?'success':'failure'}`; }

// ---------- locations & POIs ----------
function adjOf(act){ const adj={}; for(const l of act.locations){ adj[l.id] ||= new Set(); for(const k of l.links||[]){ adj[l.id].add(k); (adj[k] ||= new Set()).add(l.id); } } return adj; }
function locRevealed(l){ return !l.hidden || !!G.revealed[G.actIdx+'/'+l.id]; }
function locReqMet(l){ const r=l.req; if(!r) return true; if(r.flag && flag(r.flag)) return true; if(r.orFlag && flag(r.orFlag)) return true; return !r.flag && !r.orFlag; }
function revealLoc(id){ G.revealed[G.actIdx+'/'+id]=true; }
function pkey(locId, poiId){ return G.actIdx+'/'+locId+'/'+poiId; }
function pst(locId, poiId){ return (G.poi[pkey(locId,poiId)] ||= {}); }
function poiReqMet(loc, poi){
  const r=poi.req; if(!r) return true;
  if(r.poi && !pst(loc.id,r.poi).done) return false;
  if(r.flag && !flag(r.flag)) return false;
  if(r.item && !hasItem(r.item)) return false;
  return true;
}
function poiVisible(loc, poi){
  if(poi.hidden && !pst(loc.id,poi.id).found) return false;
  if(poi.hideLocked && !poiReqMet(loc,poi)) return false;
  if(poi.type==='npc' && pst(loc.id,poi.id).done && !poi.stay) return true;
  return true;
}
function poiDone(loc, poi){ return !!pst(loc.id,poi.id).done; }
function locCleared(loc){ return loc.pois.filter(p=>['battle','chest'].includes(p.type) && poiVisible(loc,p)).every(p=>poiDone(loc,p)); }
// Perception checks for hidden things, rolled each time you arrive
function onArrive(loc){
  const msgs=[];
  G.visited[G.actIdx+'/'+loc.id]=true;
  for(const poi of loc.pois){
    if(!poi.hidden) continue; const st=pst(loc.id,poi.id); if(st.found) continue;
    if(!poiReqMet(loc,poi) && poi.req && !poi.req.poi) continue;
    let dc = poi.hidden.dc; if(poi.hidden.hint && flag(poi.hidden.hint)) dc = poi.hidden.hintDc ?? dc-5;
    const res=skillCheck(poi.hidden.skill||'perception', dc);
    if(res.ok){ st.found=true; msgs.push({kind:'found', text:`${res.who.name.split(' ')[0]} notices something: <b>${poi.name}</b>.`, detail:checkText(res)}); }
  }
  return msgs;
}
// Re-roll perception after a POI completes (hidden things behind a door, etc.)
function recheckHidden(loc){ return onArrive(loc); }
// walking close to a hidden thing gives one extra, easier look per visit
function proximitySearch(loc, poi){
  const st=pst(loc.id,poi.id); if(st.found || !poi.hidden) return null;
  if(!poiReqMet(loc,poi) && poi.req && !poi.req.poi) return null;
  let dc = poi.hidden.dc - 2; if(poi.hidden.hint && flag(poi.hidden.hint)) dc = (poi.hidden.hintDc ?? poi.hidden.dc-5) - 2;
  const res=skillCheck(poi.hidden.skill||'perception', dc);
  if(!res.ok) return null;
  st.found=true; return {text:`${res.who.name.split(' ')[0]} spots something up close: <b>${poi.name}</b>.`, detail:checkText(res)};
}

// ---------- effects ----------
function applyFx(list, ctx={}){
  const out={msgs:[], items:[], gold:0, xp:0, endAct:false, ending:false, recruits:[]};
  for(const fx of list||[]){
    const [k,v] = Object.entries(fx)[0];
    switch(k){
      case 'flag': G.flags[v]=true; break;
      case 'unflag': delete G.flags[v]; break;
      case 'gold': G.gold=Math.max(0,G.gold+v); out.gold+=v; break;
      case 'xp': out.xp+=v; break;
      case 'item': { const it=giveItem(v); out.items.push(it); break; }
      case 'removeItem': removeItem(v); break;
      case 'recruit': { const c=recruit(v); if(c) out.recruits.push(c); break; }
      case 'reveal': revealLoc(v); out.msgs.push(`A new location is marked on your map: <b>${findLoc(v).name}</b>.`); break;
      case 'quest': setQuest(v[0], v[1]); break;
      case 'damage': for(const c of activeParty()){ const dmg=roll(v[0],v[1]); c.hp=Math.max(1,c.hp-dmg); } out.msgs.push(`The party takes ${v[0]}d${v[1]} damage each.`); break;
      case 'heal': restParty(); break;
      case 'supplies': G.supplies+=v; out.msgs.push(`+${v} camping supplies.`); break;
      case 'done': if(ctx.loc && ctx.poi) pst(ctx.loc.id, ctx.poi.id).done=true; break;
      case 'mythicSpark': G.flags.spark=true; out.msgs.push('<b style="color:var(--rift)">The ember stirs within you.</b>'); break;
      case 'mythicTier': { const p=playerChar(); grantMythicTier(p, v); restoreResources(p); out.msgs.push(`<b style="color:var(--rift)">Mythic Tier ${v}</b> — choose ${v===1?'your mythic path':'a new mythic ability'}.`); out.mythic=true; break; }
      case 'endAct': out.endAct=true; break;
      case 'ending': out.ending=true; break;
      case 'sellAll': { const it=invFind(v[0]); if(it){ const n=it.qty||1; G.gold+=n*v[1]; out.gold+=n*v[1]; G.inventory=G.inventory.filter(i=>i!==it); } break; }
      case 'freeSouls': { const it=invFind('soulGem'); if(it){ const n=it.qty||1; G.inventory=G.inventory.filter(i=>i!==it); out.xp+=300*n; G.flags.freed_souls=(G.flags.freed_souls||0)+n; out.msgs.push(`${n} soul${n>1?'s':''} drift upward, free.`); } break; }
    }
  }
  if(G._questXp){ out.xp+=G._questXp; out.questXp=G._questXp; G._questXp=0; }
  if(out.xp) grantXP(out.xp);
  return out;
}

// ---------- battles ----------
function resolveEnemies(b){
  let list=b.enemies.map(e=>e.slice());
  for(const m of b.mods||[]){ if(!flag(m.flag)) continue; for(const [mid,n] of m.remove||[]){ const e=list.find(x=>x[0]===mid); if(e) e[1]-=n; } for(const [mid,n] of m.add||[]){ const e=list.find(x=>x[0]===mid); if(e) e[1]+=n; else list.push([mid,n]); } }
  return list.filter(e=>e[1]>0);
}
function battleRewards(units, extraFx, ctx){
  // units: B.units after battle
  let xp=0; for(const u of units) if(u.side==='enemy'&&u.dead&&!u.summoned) xp+=CR_XP[u.mon.cr]||0;
  xp = Math.round(xp/XP_DIV);
  const loot=rollLoot(units);
  G.gold+=loot.gold;
  const items=loot.items.map(x=>{ const it=addToInventory(x.item); return {item:x.item, from:x.from}; });
  const before = G.roster.map(c=>c.level);
  grantXP(xp);
  const fxOut = applyFx(extraFx||[], ctx);
  return {xp:xp+fxOut.xp, gold:loot.gold+fxOut.gold, items:items.concat(fxOut.items.map(i=>({item:i}))), fx:fxOut, leveled:G.roster.filter((c,i)=>c.level>(before[i]||0))};
}

// ---------- travel ----------
function travelPath(from, to){
  const act=actData(); const adj=adjOf(act);
  const ok = id => { const l=findLoc(id); return l && locRevealed(l); };
  const prev={[from]:null}; const q=[from];
  while(q.length){ const x=q.shift(); if(x===to) break; for(const n of adj[x]||[]){ if(n in prev || !ok(n)) continue; const L=findLoc(n); if(n!==to && !locReqMet(L)) continue; prev[n]=x; q.push(n); } }
  if(!(to in prev)) return null;
  const path=[]; let x=to; while(x){ path.unshift(x); x=prev[x]; } return path;
}
function rollEncounter(toLoc){
  if(toLoc.kind==='town') return null;
  if(G.dev && G.dev.noEncounters) return null;
  if(RNG()>0.14) return null;
  const sets=actData().encounters; return sets[Math.floor(RNG()*sets.length)];
}
function fieldRestAllowed(){ const l=curLoc(); return l && l.rest==='free'; }

// ---------- merchants ----------
function merchantStock(m){
  const out=[]; const lvl = Math.min(5, G.actIdx + (G.actIdx>=1?1:0));
  for(const t of m.types){ const tbl=STOCK[t]; if(!tbl) continue; for(let i=0;i<=Math.min(lvl,tbl.length-1);i++) for(const spec of tbl[i]) out.push(spec); }
  const uni=(m.uniques||[]).filter(u=>!(G.merch[m.id+'/'+u]));
  return {generic:[...new Set(out)], uniques:uni};
}
function buyPrice(it, m){ return Math.round(itemPrice(it)*((m&&m.markup)||1)); }
function sellPrice(it){ if(it.kind==='junk') return JUNK[it.base].value; if(it.kind==='quest') return 0; return Math.floor(itemPrice(it)/2); }

// ---------- act transitions ----------
const ACT_FLOOR = [1,4,6,8,10,11];
function advanceAct(){
  G.actIdx=Math.min(ACTS.length-1, G.actIdx+1);
  G.loc = actData().start;
  const floor=ACT_FLOOR[G.actIdx]; const trained=[];
  for(const c of G.roster){ if(c.level<floor && c.xp<XP_TABLE[floor]){ c.xp=XP_TABLE[floor]; trained.push(c); } }
  autoLevelAll();
  restParty();
  return trained;
}

// ---------- chests: traps, locks, loot ----------
function trapSpring(trap){
  const lines=[];
  for(const c of activeParty()){
    let dmg=roll(trap.dmg[0],trap.dmg[1]);
    if(trap.save){ const s=charStats(c); const r=d(20)+s.saves[trap.save[0]]; if(r>=trap.save[1]) dmg=Math.floor(dmg/2); }
    c.hp=Math.max(1,c.hp-dmg); lines.push(`${c.name.split(' ')[0]} −${dmg}`);
  }
  return `The ${trap.name||'trap'} goes off! ${lines.join(', ')}.`;
}
function chestTrapCheck(loc, poi){ // returns {detected, res}
  const st=pst(loc.id,poi.id); const trap=poi.chest.trap;
  if(!trap || st.trapDone) return null;
  if(st.trapSeen) return {detected:true};
  const res=skillCheck('perception', trap.dc); if(res.ok) st.trapSeen=true;
  return {detected:res.ok, res};
}
function chestDisarm(loc, poi){ const st=pst(loc.id,poi.id); const trap=poi.chest.trap; const res=skillCheck('thievery', trap.disarm); if(res.ok){ st.trapDone=true; return {ok:true,res,text:`${res.who.name.split(' ')[0]} disarms the ${trap.name||'trap'}.`}; } st.trapDone=true; return {ok:false,res,text:trapSpring(trap)}; }
function chestTrigger(loc, poi){ const st=pst(loc.id,poi.id); st.trapDone=true; return trapSpring(poi.chest.trap); }
function chestUnlock(loc, poi, method){
  const st=pst(loc.id,poi.id); const dc=poi.chest.lock;
  const res = method==='force'? skillCheck('athletics', dc+4) : skillCheck('thievery', dc);
  if(res.ok) st.unlocked=true; else st.lockFail=playerChar().level;
  return res;
}
function chestLocked(loc, poi){ return poi.chest.lock && !pst(loc.id,poi.id).unlocked; }
function chestLoot(loc, poi){
  const ch=poi.chest; const st=pst(loc.id,poi.id); st.done=true;
  const fx=[]; if(ch.gold) fx.push({gold:ch.gold}); for(const i of ch.items||[]) fx.push({item:i}); fx.push(...(ch.fx||[]));
  return applyFx(fx,{loc,poi});
}

// ---------- dialogue helpers ----------
function optAvailable(o){
  const r=o.req; if(!r) return true;
  if(r.item && !hasItem(r.item)) return false;
  if(r.flag && !flag(r.flag)) return false;
  if(r.notFlag && flag(r.notFlag)) return false;
  if(r.companion && !hasCompanion(r.companion)) return false;
  if(r.gold && G.gold<r.gold) return false;
  return true;
}

// ---- render.js ----
// ============================================================
//  RENDERER — isometric battlefield, sprites, portraits, effects
// ============================================================
const TW = 72, TH = 36, WH = 44;
const Rn = {
  cv:null, ctx:null, w:0, h:0, dpr:1,
  cam:{x:0,y:0,z:1, tx:null, ty:null}, offX:0, offY:0, S:null,
  tiles:{}, time:0, floats:[], fxs:[], particles:[], hover:null, overlay:null, speed:1,
  running:false,
};
function hexA(hex, a){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function shade(hex, f){ const h=hex.replace('#',''); const n=parseInt(h,16); let r=n>>16&255,g=n>>8&255,b=n&255; if(f<0){ r*=1+f; g*=1+f; b*=1+f; } else { r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } return `rgb(${r|0},${g|0},${b|0})`; }
function seeded(seed){ return mulberry32(seed*9973+17); }

// ------------------------------------------------------------
//  Tile textures
// ------------------------------------------------------------
function diamondPath(c, cx, cy, w=TW, h=TH){ c.beginPath(); c.moveTo(cx, cy-h/2); c.lineTo(cx+w/2, cy); c.lineTo(cx, cy+h/2); c.lineTo(cx-w/2, cy); c.closePath(); }
function makeFloor(biomeKey, shadeIdx, variant){
  const key = biomeKey+'_'+shadeIdx+'_'+variant;
  if(Rn.tiles[key]) return Rn.tiles[key];
  const bio = BIOMES[biomeKey];
  const cv = document.createElement('canvas'); cv.width=TW; cv.height=TH+2;
  const c = cv.getContext('2d'); const r = seeded(variant*13+shadeIdx*7+biomeKey.length);
  diamondPath(c, TW/2, TH/2+1); c.save(); c.clip();
  c.fillStyle = bio.ground[shadeIdx%bio.ground.length]; c.fillRect(0,0,TW,TH+2);
  // noise
  for(let i=0;i<70;i++){ c.fillStyle = r()<0.5? 'rgba(0,0,0,0.10)':'rgba(255,240,220,0.05)'; c.fillRect(r()*TW, r()*TH, 1+r()*2, 1+r()*1.5); }
  const style = {city:'flag', fortress:'flag', temple:'flag', crypt:'tiles', cave:'rough', waste:'cracked', vhal:'flag', abyss:'flesh', rift:'obsidian'}[biomeKey]||'rough';
  c.lineWidth=1;
  if(style==='flag'){
    c.strokeStyle='rgba(0,0,0,0.28)';
    const n = 2; for(let i=1;i<n;i++){ c.beginPath(); c.moveTo(TW/2 - TW/2*i/n, TH/2*i/n); c.lineTo(TW - TW/2*i/n, TH/2 + TH/2*i/n - TH/2 + TH/2); c.stroke(); }
    c.beginPath(); c.moveTo(TW/4, TH/4+1); c.lineTo(TW*3/4, TH*3/4+1); c.stroke();
    c.beginPath(); c.moveTo(TW*3/4, TH/4+1); c.lineTo(TW/4, TH*3/4+1); c.stroke();
    c.strokeStyle='rgba(255,230,200,0.06)'; c.beginPath(); c.moveTo(TW/4+1, TH/4+2); c.lineTo(TW*3/4+1, TH*3/4+2); c.stroke();
    if(r()<0.35){ c.strokeStyle='rgba(0,0,0,0.35)'; c.beginPath(); let x=r()*TW, y=r()*TH; c.moveTo(x,y); for(let k=0;k<3;k++){ x+= (r()-0.5)*16; y+=(r()-0.5)*8; c.lineTo(x,y);} c.stroke(); }
  } else if(style==='tiles'){
    c.strokeStyle='rgba(0,0,0,0.3)';
    for(let i=1;i<3;i++){ c.beginPath(); c.moveTo(TW/2*i/1.5 - 10, 0); c.lineTo(TW/2*i/1.5+TW/2-10, TH+2); c.stroke(); }
    if(r()<0.4){ c.fillStyle='rgba(80,110,80,0.18)'; c.beginPath(); c.ellipse(r()*TW, r()*TH, 8, 4, 0, 0, Math.PI*2); c.fill(); }
  } else if(style==='cracked'){
    c.strokeStyle='rgba(20,5,0,0.4)';
    for(let k=0;k<2;k++){ c.beginPath(); let x=r()*TW, y=r()*TH; c.moveTo(x,y); for(let j=0;j<4;j++){ x+=(r()-0.5)*20; y+=(r()-0.5)*10; c.lineTo(x,y);} c.stroke(); }
    if(r()<0.25){ c.strokeStyle='rgba(255,90,30,0.35)'; c.beginPath(); let x=r()*TW, y=r()*TH; c.moveTo(x,y); x+=10; y+=4; c.lineTo(x,y); c.stroke(); }
  } else if(style==='flesh'){

function isoY(x,y){ return (x+y)*TH/2; }
function toScreen(wx,wy){ const z=Rn.cam.z; return [ (isoX(wx,wy)-Rn.cam.x)*z + Rn.w/2 + Rn.offX, (isoY(wx,wy)-Rn.cam.y)*z + Rn.h/2 + Rn.offY ]; }
function toWorld(sx,sy){ const z=Rn.cam.z; const ix=(sx-Rn.w/2-Rn.offX)/z+Rn.cam.x, iy=(sy-Rn.h/2-Rn.offY)/z+Rn.cam.y; const wx=(ix/(TW/2)+iy/(TH/2))/2, wy=(iy/(TH/2)-ix/(TW/2))/2; return [wx,wy]; }

const SKIN = { human:['#e0b890','#c89870','#9a6a48','#f0cca8'], elf:['#f0d8c0','#e0c8b0','#c8a888'], dwarf:['#d8a888','#c09070','#a07858'], halforc:['#8aa070','#7a9060','#6a8a6a'], halfling:['#e8c098','#d0a078','#b88058'], aasimar:['#f4e0d0','#e8d0c0','#d0b8a8'], tiefling:['#b86060','#a05050','#8a4a6a'] };

function weaponLook(it){ if(!it) return 'none'; const b=it.base; return ({longsword:'blade',scimitar:'blade',rapier:'rapier',shortsword:'blade',dagger:'dagger',greatsword:'greatblade',falchion:'greatblade',battleaxe:'axe',greataxe:'greataxe',heavyMace:'mace',morningstar:'mace',warhammer:'mace',earthbreaker:'maul',quarterstaff:'staff',longspear:'spear',glaive:'glaive',shortbow:'bow',longbow:'bow',compLongbow:'bow',lightCrossbow:'crossbow',unarmed:'none'})[b]||'blade'; }
function lookForChar(c){
  const r = seeded(c.portraitSeed||1);
  const skins = SKIN[c.race]||SKIN.human; const skin = skins[Math.floor(r()*skins.length)];
  const hair = c.race==='aasimar'? ['#f0e0a0','#e8e8f0','#d0b060'][Math.floor(r()*3)] : HAIR[Math.floor(r()*HAIR.length)];
  const arm = c.equip.armor? c.equip.armor.base : null;
  const armorCol = !arm? null : ['fullplate','halfplate'].includes(arm)? '#a8adb6' : ['breastplate','scalemail'].includes(arm)? '#8a8e96' : arm==='chainshirt'? '#7a7e84' : '#6a4a30';
  const C = CLASSES[c.cls];
  const cloth = ({fighter:'#6a1e1e',barbarian:'#5a3a22',paladin:'#e0d6c0',ranger:'#3a5a2a',rogue:'#2a2a38',cleric:'#e8dcc0',wizard:'#2a3a7a',sorcerer:'#6a1a3a'})[c.cls];
  return {kind:'humanoid', skin, hair, armor:armorCol, heavy:['fullplate','halfplate'].includes(arm), cloth, trim:C.color,
    helm: ['fullplate','halfplate'].includes(arm) && r()<0.6, hood: ['rogue','wizard','sorcerer'].includes(c.cls) && r()<0.55, beard: (c.race==='dwarf') || (c.gender==='m' && r()<0.3),
    ears: ['elf'].includes(c.race)?'long': ['halfling'].includes(c.race)?'small':null, horns: c.race==='tiefling', halo: c.race==='aasimar', tusks: c.race==='halforc',
    weapon: weaponLook(c.equip.main), shield: !!(c.equip.off && c.equip.off.kind==='shield'), scale: c.race==='halfling'?0.78 : c.race==='dwarf'?0.86:1, wide: c.race==='dwarf'?1.2 : c.race==='halforc'?1.1:1,

}

    case 'mace': case 'maul': c.strokeStyle=dark; c.lineWidth=3*s; c.beginPath(); c.moveTo(0,4*s); c.lineTo(4*s,-(kind==='maul'?36:24)*s); c.stroke(); c.fillStyle='#8a8e96'; if(kind==='maul'){ c.fillRect(-6*s,-44*s,20*s,12*s); } else { c.beginPath(); c.arc(4*s,-26*s,6*s,0,Math.PI*2); c.fill(); c.fillStyle=steel; for(let a=0;a<6;a++){ c.beginPath(); c.arc(4*s+Math.cos(a)*6*s,-26*s+Math.sin(a)*6*s,1.5*s,0,Math.PI*2); c.fill(); } } break;
    case 'staff': c.strokeStyle='#4a3020'; c.lineWidth=3*s; c.beginPath(); c.moveTo(-2*s,14*s); c.lineTo(4*s,-40*s); c.stroke(); if(glow){ const p=0.6+0.4*Math.sin(T*3); c.fillStyle=hexA(glow,0.9); c.beginPath(); c.arc(4*s,-43*s,4*s,0,Math.PI*2); c.fill(); c.fillStyle=hexA(glow,0.25*p); c.beginPath(); c.arc(4*s,-43*s,10*s,0,Math.PI*2); c.fill(); } break;

    case 'bow': c.strokeStyle='#5a3a20'; c.lineWidth=2.5*s; c.beginPath(); c.arc(-8*s,-12*s,22*s,-1.2,1.2); c.stroke(); c.strokeStyle='rgba(230,220,200,0.7)'; c.lineWidth=0.8; c.beginPath(); c.moveTo(-8*s+Math.cos(-1.2)*22*s,-12*s+Math.sin(-1.2)*22*s); c.lineTo(-8*s+Math.cos(1.2)*22*s,-12*s+Math.sin(1.2)*22*s); c.stroke(); break;

}

function drawHumanoid(c, L, sx, sy, s, dir, T, u){

  // shield (off side)
  if(L.shield){ const shx = sx - dir*13*sc*wide, shy = ty-H*0.12+bob; c.fillStyle='#6a1e1e'; c.beginPath(); c.moveTo(shx-7*sc, shy-12*sc); c.lineTo(shx+7*sc, shy-12*sc); c.lineTo(shx+7*sc, shy+2*sc); c.quadraticCurveTo(shx, shy+14*sc, shx-7*sc, shy+2*sc); c.closePath(); c.fill(); c.strokeStyle='#c9a45c'; c.lineWidth=1.5*sc; c.stroke(); c.lineWidth=1; c.fillStyle='#c9a45c'; c.beginPath(); c.arc(shx, shy-3*sc, 2.5*sc, 0, Math.PI*2); c.fill(); }

function drawDemon(c, L, sx, sy, s, dir, T, u){
  const sc = s*(L.scale||1); const skin=L.skin||'#8a3a3a'; const dk=shade(skin,-0.45), lt=shade(skin,0.2);

    c.fillStyle=dk; c.fillRect(sx-W*0.6*sc, sy-6*sc, 6*sc, 6*sc); c.fillRect(sx+W*0.3*sc, sy-6*sc, 6*sc, 6*sc);

    if(b==='toad'){ c.fillStyle='#1a1a0a'; c.beginPath(); c.moveTo(sx+dir*-6*sc, headY+3*sc); c.lineTo(sx+dir*16*sc, headY+2*sc); c.stroke(); c.strokeStyle='#1a1a0a'; c.lineWidth=2*sc; c.beginPath(); c.moveTo(sx+dir*-8*sc, headY+3*sc); c.quadraticCurveTo(sx+dir*6*sc, headY+8*sc, sx+dir*16*sc, headY+2*sc); c.stroke(); c.lineWidth=1; }

    c.fillStyle=dk; c.fillRect(sx-8*sc, sy-14*sc, 4*sc, 14*sc); c.fillRect(sx+4*sc, sy-14*sc, 4*sc, 14*sc);
    headY = sy-60*sc+bob; c.fillStyle='#c8b8a0'; c.beginPath(); c.ellipse(sx, headY+6*sc, 10*sc, 5*sc, 0,0,Math.PI*2); c.fill();
    c.fillStyle=lt; c.beginPath(); c.ellipse(sx+dir*3*sc, headY, 7*sc, 6*sc, 0,0,Math.PI*2); c.fill();
    c.fillStyle='#3a3020'; c.beginPath(); c.moveTo(sx+dir*8*sc, headY-2*sc); c.lineTo(sx+dir*20*sc, headY+4*sc); c.lineTo(sx+dir*8*sc, headY+3*sc); c.closePath(); c.fill();
  } else if(b==='lean' || b==='slender'){
    const w = b==='slender'?8:9;
    c.fillStyle=dk; c.fillRect(sx-6*sc, sy-26*sc, 4*sc, 26*sc); c.fillRect(sx+2*sc, sy-26*sc, 4*sc, 26*sc);
    c.fillStyle=g; c.beginPath(); c.moveTo(sx-w*sc, sy-26*sc); c.lineTo(sx-(w+3)*sc, sy-54*sc+bob); c.lineTo(sx+(w+3)*sc, sy-54*sc+bob); c.lineTo(sx+w*sc, sy-26*sc); c.closePath(); c.fill();
    if(L.cloth){ c.fillStyle=L.cloth; c.beginPath(); c.moveTo(sx-w*sc, sy-30*sc); c.lineTo(sx+w*sc, sy-30*sc); c.lineTo(sx+(w+4)*sc, sy-4*sc); c.lineTo(sx-(w+4)*sc, sy-4*sc); c.closePath(); c.fill(); }

    if(b==='slender'){ c.fillStyle='#1a0a10'; c.beginPath(); c.ellipse(sx-dir*1*sc, headY+2*sc, 7*sc, 10*sc, 0, Math.PI*0.9, Math.PI*2.1); c.fill(); }

  else { L=u_or_c.look||MONSTERS[u_or_c.mid].look; bg = u_or_c.mon?.type==='undead'?'#4a5a7a':'#7a2a1a'; }

    for(const [x,y] of O.aoo||[]){ const [sx,sy]=toScreen(x+0.5,y+0.5); c.fillStyle='#ff4a3a'; c.font='700 11px "Alegreya Sans", sans-serif'; c.textAlign='center'; c.fillText('!',sx,sy+4); c.strokeStyle='#ff4a3a'; c.beginPath(); c.arc(sx,sy,7,0,Math.PI*2); c.stroke(); }
    const [ex,ey]=O.path[O.path.length-1]; cell(ex,ey,null,'rgba(255,220,140,0.9)');

function wait(ms){ return new Promise(r=>setTimeout(r, ms/Rn.speed)); }
function drawFx(c, dt, z){
  Rn.fxs = Rn.fxs.filter(f=>{
    f.t += dt*Rn.speed; const k=f.t/f.dur; if(k>=1) return false;
    if(f.type==='proj'){
      const [ax,ay]=toScreen(f.a[0],f.a[1]); const [bx,by]=toScreen(f.b[0],f.b[1]); const lift=40*z;
      const px=ax+(bx-ax)*k, py=ay-lift+(by-ay)*k - Math.sin(k*Math.PI)*(f.kind==='arrow'?20*z:0);
      c.save(); c.globalCompositeOperation='lighter';
      if(f.kind==='arrow'){ const ang=Math.atan2(by-ay,bx-ax); c.strokeStyle='#e8dcc0'; c.lineWidth=2; c.beginPath(); c.moveTo(px-Math.cos(ang)*14,py-Math.sin(ang)*14); c.lineTo(px,py); c.stroke(); }
      else if(f.kind==='ray'||f.kind==='lightning'){ c.strokeStyle=hexA(f.col,1-k*0.5); c.lineWidth=f.kind==='ray'?4:2.5; c.shadowColor=f.col; c.shadowBlur=14; c.beginPath(); c.moveTo(ax,ay-lift); if(f.kind==='lightning'){ const n=8; for(let i=1;i<=n;i++){ const tx=ax+(bx-ax)*i/n+(i<n?(Math.random()-0.5)*16:0), ty=ay-lift+(by-ay+lift*0.6)*i/n+(i<n?(Math.random()-0.5)*16:0); c.lineTo(tx,ty);} } else c.lineTo(bx,by-lift*0.6); c.stroke(); }
      else { c.fillStyle=hexA(f.col,0.95); c.shadowColor=f.col; c.shadowBlur=18; c.beginPath(); c.arc(px,py,5,0,Math.PI*2); c.fill(); for(let i=1;i<4;i++){ c.fillStyle=hexA(f.col,0.3/i); c.beginPath(); c.arc(px-(bx-ax)*0.04*i,py-(by-ay)*0.04*i,4,0,Math.PI*2); c.fill(); } }
      c.restore();
      return true;
    }
    if(f.type==='area'){
      c.save(); c.globalCompositeOperation='lighter';
      const a = Math.sin(k*Math.PI);
      for(const [x,y] of f.cells){ const [sx,sy]=toScreen(x+0.5,y+0.5); diamondPath(c,sx,sy,TW*z,TH*z); c.fillStyle=hexA(f.col,0.35*a); c.fill(); if(['fire','explosion','pillar','holy','heal','frost','hail','sparkle','dark','rift','cloud','fear','prism','vines','splash','dust'].includes(f.fx) && Math.random()<0.3*Rn.speed) Rn.particles.push({x:sx+(Math.random()-0.5)*TW*z*0.6, y:sy, vx:(Math.random()-0.5)*14, vy: f.fx==='hail'?40:-40-Math.random()*50, life:0.8, col: f.fx==='dark'?'#6a4aa0': f.fx==='heal'?'#fff0a0':f.col, sz:2}); }
      if(f.fx==='explosion'||f.fx==='ring'||f.fx==='aura'){ const [cx,cy]=f.center; const [sx,sy]=toScreen(cx,cy); c.strokeStyle=hexA(f.col,1-k); c.lineWidth=3; c.beginPath(); c.ellipse(sx,sy,TW*z*f.rad*k,TH*z*f.rad*k,0,0,Math.PI*2); c.stroke(); }
      if(f.fx==='pillar'||f.fx==='holy'){ for(const [x,y] of f.cells.slice(0,30)){ const [sx,sy]=toScreen(x+0.5,y+0.5); const g=c.createLinearGradient(sx,sy-160*z,sx,sy); g.addColorStop(0,hexA(f.col,0)); g.addColorStop(1,hexA(f.col,0.25*a)); c.fillStyle=g; c.fillRect(sx-TW*z*0.3,sy-160*z,TW*z*0.6,160*z); } }
      c.restore();
      return true;
    }
    return true;
  });
}

View.float = (u,txt,col)=>{ const row = Rn.floats.filter(f=>f.u===u && f.t<0.6).length; Rn.floats.push({u,txt,col,t:0,row}); };
View.move = async (u, path)=>{
  for(let i=1;i<path.length;i++){
    const [ax,ay]=path[i-1], [bx,by]=path[i];
    const dx=bx-ax, dy=by-ay; if(dx-dy!==0) u.facing = (dx-dy)>0?1:-1;
    const dur=Math.max(40,130/Rn.speed); const st=performance.now();
    await new Promise(res=>{ const step=()=>{ const k=Math.min(1,(performance.now()-st)/dur); u.anim.ox=(ax-u.x)+dx*k; u.anim.oy=(ay-u.y)+dy*k; if(k<1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
    u.x=bx; u.y=by; u.anim.ox=0; u.anim.oy=0;
  }
  if(B.active===u) centerCamOn(u.x+u.size/2,u.y+u.size/2);
};
View.lunge = async (u,t,ranged)=>{
  const [ax,ay]=center(u), [bx,by]=center(t); const dx=isoX(bx,by)-isoX(ax,ay), dy=isoY(bx,by)-isoY(ax,ay); const l=Math.hypot(dx,dy)||1;
  if(dx!==0) u.facing = dx>0?1:-1;
  if(ranged){ await wait(60); return; }
  const dur=180; const st=performance.now();
  await new Promise(res=>{ const step=()=>{ const k=Math.min(1,(performance.now()-st)/(dur/Rn.speed)); const e=Math.sin(k*Math.PI); u.lunge=[dx/l*10*e, dy/l*10*e]; if(k<1) requestAnimationFrame(step); else { u.lunge=null; res(); } }; requestAnimationFrame(step); });
};
View.projectile = async (a,b,col,kind)=>{ const [ax,ay]=center(a), [bx,by]=center(b); const dur = kind==='ray'||kind==='lightning'? 0.35 : 0.3; Rn.fxs.push({type:'proj', a:[ax,ay], b:[bx,by], col, kind:kind==='arrow'?'arrow':kind==='ray'||kind==='lightning'?kind:'orb', t:0, dur}); await wait(dur*1000); };
View.area = async (cells,col,fx,origin)=>{ if(!cells.length) return; let cx=0,cy=0; for(const [x,y] of cells){cx+=x;cy+=y;} cx=cx/cells.length+0.5; cy=cy/cells.length+0.5; const rad=Math.sqrt(cells.length)/1.6; Rn.fxs.push({type:'area', cells, col, fx, t:0, dur:0.6, center:[cx,cy], rad}); await wait(fx==='glow'?250:450); };
View.death = async (u)=>{ if(u.dead){ u.fade=1; const st=performance.now(); const step=()=>{ u.fade=Math.max(0,1-(performance.now()-st)/700); if(u.fade>0) requestAnimationFrame(step); }; requestAnimationFrame(step); } };
View.pause = (ms)=>wait(ms);
View.spawn = (u)=>{};

  const mb=$('.mb',bg); if(typeof body==='string') mb.innerHTML=body; else if(body) mb.appendChild(body);
  const mf=$('.mf',bg);

  for(const b of buttons){ const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.label; if(b.disabled) el.disabled=true; el.onclick=()=>{ const r=b.onClick? b.onClick(close):undefined; if(r!==false && !b.keep) close(); }; mf.appendChild(el); }

function migrate(){ G.settings ||= {}; const d={difficulty:'normal', speed:1.5, autoEnd:true, companionAI:false, autoLevel:true, autoLevelPlayer:false}; for(const k in d) if(G.settings[k]===undefined) G.settings[k]=d[k]; G.inventory ||= []; G.flags ||= {}; G.quests ||= {}; G.poi ||= {}; G.revealed ||= {}; G.visited ||= {}; G.merch ||= {}; if(G.supplies===undefined) G.supplies=3; for(const c of G.roster){ c.res ||= {}; c.res.grants ||= {}; c.toggles ||= {powerAttack:false, deadlyAim:false}; } }

function startTitleAnim(){
  const cv=$('#tcv'); const c=cv.getContext('2d'); let parts=[]; let t0=performance.now();
  cancelAnimationFrame(titleAnim);
  const frame=(now)=>{
    if($('#scr-title').hidden) return;
    const dpr=Math.min(2,devicePixelRatio||1); const w=cv.clientWidth, h=cv.clientHeight; if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    c.setTransform(dpr,0,0,dpr,0,0); const t=(now-t0)/1000;
    const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#12060a'); g.addColorStop(0.55,'#3a0e0c'); g.addColorStop(1,'#0a0504'); c.fillStyle=g; c.fillRect(0,0,w,h);
    // rift
    const rx=w*0.5, ry=h*0.13; for(let i=0;i<5;i++){ const rg=c.createRadialGradient(rx,ry,0,rx,ry,w*(0.2+i*0.12)); rg.addColorStop(0,`rgba(255,${90+i*10},40,${0.16-i*0.025})`); rg.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=rg; c.fillRect(0,0,w,h); }
    c.save(); c.translate(rx,ry); c.strokeStyle='rgba(255,170,90,0.85)'; c.lineWidth=2; c.shadowColor='#ff5a1a'; c.shadowBlur=24; c.beginPath(); for(let i=0;i<=40;i++){ const k=i/40; const x=(k-0.5)*w*0.34; const y=Math.sin(k*9+t*0.8)*6*Math.sin(k*Math.PI) + (Math.sin(k*23+t*2)*2); if(i===0) c.moveTo(x,y); else c.lineTo(x,y);} c.stroke(); c.restore();
    // city silhouette
    c.fillStyle='#070304'; c.beginPath(); c.moveTo(0,h); const base=h*0.78; let x=0; const r=seeded(3); while(x<w){ const bw=20+r()*50, bh=20+r()*90*(Math.abs(x-w/2)<w*0.25?1.4:1); c.lineTo(x,base-bh); if(r()<0.25){ c.lineTo(x+bw/2,base-bh-30-r()*40); } c.lineTo(x+bw,base-bh); x+=bw; } c.lineTo(w,h); c.closePath(); c.fill();
    // wardstone
    c.fillStyle='#0c0608'; c.beginPath(); c.moveTo(w*0.5-18,base+30); c.lineTo(w*0.5-12,base-120); c.lineTo(w*0.5,base-150); c.lineTo(w*0.5+12,base-120); c.lineTo(w*0.5+18,base+30); c.fill();
    const pulse=0.5+0.5*Math.sin(t*1.4); c.fillStyle=`rgba(255,190,110,${0.35+0.4*pulse})`; for(let i=0;i<5;i++) c.fillRect(w*0.5-3, base-120+i*26, 6, 8);
    // embers
    if(parts.length<160) parts.push({x:Math.random()*w,y:h+5,vx:(Math.random()-0.5)*14,vy:-20-Math.random()*45,l:5+Math.random()*4,s:1+Math.random()*2});
    c.globalCompositeOperation='lighter'; parts=parts.filter(p=>{ p.x+=p.vx/60; p.y+=p.vy/60; p.l-=1/60; c.fillStyle=`rgba(255,${120+Math.random()*80|0},50,${Math.min(1,p.l/3)})`; c.fillRect(p.x,p.y,p.s,p.s); return p.l>0; }); c.globalCompositeOperation='source-over';
    const vg=c.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,Math.max(w,h)*0.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.75)'); c.fillStyle=vg; c.fillRect(0,0,w,h);
    titleAnim=requestAnimationFrame(frame);
  };
  titleAnim=requestAnimationFrame(frame);
}

    body=`<p class="muted" style="margin-top:0">Spend <b class="gold num">${left}</b> of ${POINT_BUY_BUDGET} points. Scores range from 7 to 18 before racial adjustments.</p>

    ${ABILS.map(k=>{ const fin=c.abil[k]; return `<div>${ABIL_NAMES[k]}${R.flex?` <label class="dim" style="font-size:12px;margin-left:6px"><input type="radio" name="flex" value="${k}" ${CR.flex===k?'checked':''}> +2</label>`:''}</div><button class="btn sq" data-dn="${k}" ${CR.abil[k]<=7?'disabled':''} aria-label="Lower ${ABIL_NAMES[k]}">−</button><div class="v num">${CR.abil[k]}</div><button class="btn sq" data-up="${k}" ${CR.abil[k]>=18||POINT_BUY[CR.abil[k]+1]-POINT_BUY[CR.abil[k]]>left?'disabled':''} aria-label="Raise ${ABIL_NAMES[k]}">+</button><div class="v num" style="color:var(--gold-hi)">${fin}</div><div class="num" style="text-align:center">${fmtMod(mod(fin))}</div>`; }).join('')}</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn small" id="recbtn">Use recommended spread</button></div>`;
  }
  if(step===3){
    const need=levelNeeds(c,1); const total = need.feat + need.bonusFeat;
    const probe=JSON.parse(JSON.stringify(c)); probe.feats=[];
    const picks = CR.feats;
    const nBonus = need.bonusFeat;
    body = `<p class="muted" style="margin-top:0">Choose <b class="gold">${total}</b> feat${total>1?'s':''}${nBonus?` (at least ${nBonus} must be a combat feat)`:''}. Chosen: <b class="num">${picks.length}/${total}</b>.</p>
      <div class="feat-list">${Object.entries(FEATS).map(([id,F])=>{ const ok=F.pre({abil:c.abil, bab:babFor(CLASSES[c.cls].bab,1), feats:picks, cls:c.cls, level:1}); const sel=picks.includes(id); return `<button class="feat ${sel?'sel':''}" data-feat="${id}" ${(!ok&&!sel)||(!sel&&picks.length>=total)?'disabled':''}><b>${F.name}${F.type==='combat'?' <span class="dim" style="font-weight:400">· combat</span>':''}</b><span>${F.desc}</span></button>`; }).join('')}</div>`;
  }
  if(step===4){
    body=`<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img class="portrait" src="${portraitFor(c,150,188)}" width="150" height="188" alt="Portrait"><button class="btn small" id="reroll">New face</button></div>
      <div style="display:flex;flex-direction:column;gap:14px;flex:1;min-width:220px">
        <div class="field"><label for="cname">Name</label><input type="text" id="cname" maxlength="28" value="${esc(CR.name)}" placeholder="Your commander's name"></div>
        <div class="field"><label>Figure</label><div style="display:flex;gap:6px"><button class="btn small ${CR.gender==='m'?'on':''}" data-g="m">Masculine</button><button class="btn small ${CR.gender==='f'?'on':''}" data-g="f">Feminine</button></div></div>
      </div></div>`;
  }
  if(step===5){
    body=`<p class="prose">Choose how hard the Abyss pushes back. You can change this later from the campaign map.</p>
    <div class="cards">${Object.entries(DIFFICULTY).map(([k,D])=>`<button class="card ${CR.diff===k?'sel':''}" data-diff="${k}"><h3>${D.name}</h3><p>${D.desc}</p></button>`).join('')}</div>`;
  }
  const canNext = step===3? CR.feats.length===levelNeeds(c,1).feat+levelNeeds(c,1).bonusFeat && validateBonus(c) : step===4? CR.name.trim().length>0 : true;
  el.innerHTML = `
  <nav class="steps panel plain" aria-label="Creation steps"><div class="eyebrow" style="padding:4px 10px 10px">Your Commander</div>${CR_STEPS.map((n,i)=>`<button class="step ${i===step?'cur':''} ${i<step?'done':''}" data-step="${i}" ${i>step?'disabled':''}><b>${['I','II','III','IV','V','VI'][i]}</b>${n}</button>`).join('')}
    <div style="flex:1"></div><button class="btn ghost small" id="crback">Back to title</button></nav>
  <main class="create-main panel plain"><div><div class="eyebrow">Step ${step+1} of 6</div><h2 style="font-size:26px;margin-top:4px">${['Choose a people','Choose a calling','Assign abilities','Choose feats','Name yourself','Set the difficulty'][step]}</h2></div><hr class="rule" style="margin:0"><div class="body scroll">${body}</div>
    <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn ghost" id="crprev" ${step===0?'disabled':''}>Previous</button>${step<5?`<button class="btn primary" id="crnext" ${canNext?'':'disabled'}>Next</button>`:`<button class="btn primary" id="crgo">Begin the Crusade</button>`}</div></main>
  <aside class="create-side panel plain">
    <div style="display:flex;gap:12px;align-items:center"><img class="portrait" src="${portraitFor(c,72,90)}" width="72" height="90" alt=""><div><div style="font-family:var(--f-display);font-size:18px;color:var(--gold-hi)">${esc(CR.name||'Unnamed')}</div><div class="muted">${RACES[CR.race].name} ${CLASSES[CR.cls].name} 1</div></div></div>
    <hr class="rule" style="margin:4px 0">
    <dl class="statgrid"><dt>Hit points</dt><dd>${s.hpMax}</dd><dt>Armor Class</dt><dd>${s.ac}</dd><dt>Touch / flat-footed</dt><dd>${s.touch} / ${s.ff}</dd><dt>Attack</dt><dd>${fmtMod(P.iters[0])} ${esc(P.name)}</dd><dt>Damage</dt><dd>${P.dmg.n}d${P.dmg.d}${fmtMod(P.dmg.b)}</dd><dt>Initiative</dt><dd>${fmtMod(s.init)}</dd><dt>Speed</dt><dd>${s.speed} ft</dd><dt>Fort / Ref / Will</dt><dd>${fmtMod(s.saves.fort)} / ${fmtMod(s.saves.ref)} / ${fmtMod(s.saves.will)}</dd>${s.cl?`<dt>Spell save DC</dt><dd>${s.dcBase+1} (1st)</dd>`:''}</dl>
    <hr class="rule" style="margin:4px 0">
    <div class="abilrow">${ABILS.map(k=>`<div class="abil"><div class="k">${k.toUpperCase()}</div><div class="s">${s.abil[k]}</div><div class="m">${fmtMod(s.mod[k])}</div></div>`).join('')}</div>
    ${CR.feats.length?`<div class="muted" style="font-size:13px">Feats: ${CR.feats.map(f=>FEATS[f].name).join(', ')}</div>`:''}
    <div class="muted" style="font-size:13px">${Object.entries(CLASSES[CR.cls].features).filter(([l])=>+l<=3).flatMap(([l,fs])=>fs).filter((v,i,a)=>a.indexOf(v)===i).map(f=>CLASS_FEATURE_TEXT[f]).filter(Boolean).slice(0,4).map(t=>'· '+t).join('<br>')}</div>
  </aside>`;
  // wire
  $$('[data-race]',el).forEach(b=>b.onclick=()=>{ CR.race=b.dataset.race; renderCreate(); });
  $$('[data-cls]',el).forEach(b=>b.onclick=()=>{ CR.cls=b.dataset.cls; applyRec(); renderCreate(); });
  $$('[data-up]',el).forEach(b=>b.onclick=()=>{ CR.abil[b.dataset.up]++; CR.feats=[]; renderCreate(); });
  $$('[data-dn]',el).forEach(b=>b.onclick=()=>{ CR.abil[b.dataset.dn]--; CR.feats=[]; renderCreate(); });
  $$('input[name=flex]',el).forEach(r=>r.onchange=()=>{ CR.flex=r.value; CR.feats=[]; renderCreate(); });
  const rb=$('#recbtn',el); if(rb) rb.onclick=()=>{ applyRec(); renderCreate(); };
  $$('[data-feat]',el).forEach(b=>b.onclick=()=>{ const f=b.dataset.feat; if(CR.feats.includes(f)) CR.feats=CR.feats.filter(x=>x!==f && !(FEATS[x].pre && !FEATS[x].pre({abil:c.abil,bab:1,feats:CR.feats.filter(y=>y!==f),cls:c.cls,level:1}))); else CR.feats.push(f); renderCreate(); });
  const nm=$('#cname',el); if(nm) nm.oninput=()=>{ CR.name=nm.value; const nb=$('#crnext'); if(nb) nb.disabled=!CR.name.trim(); };
  $$('[data-g]',el).forEach(b=>b.onclick=()=>{ CR.gender=b.dataset.g; renderCreate(); });
  const rr=$('#reroll',el); if(rr) rr.onclick=()=>{ CR.seed=Math.floor(Math.random()*1e6); portraitCache.clear(); renderCreate(); };
  $$('[data-diff]',el).forEach(b=>b.onclick=()=>{ CR.diff=b.dataset.diff; renderCreate(); });
  $$('[data-step]',el).forEach(b=>b.onclick=()=>{ CR.step=+b.dataset.step; renderCreate(); });
  $('#crprev',el).onclick=()=>{ CR.step=Math.max(0,CR.step-1); renderCreate(); };
  const nx=$('#crnext',el); if(nx) nx.onclick=()=>{ if(CR.step===2){ CR.feats=[]; } CR.step++; renderCreate(); };
  const go=$('#crgo',el); if(go) go.onclick=()=>finishCreation();
  $('#crback',el).onclick=()=>goTitle();
}
function validateBonus(c){ const need=levelNeeds(c,1); if(!need.bonusFeat) return true; return CR.feats.filter(f=>FEATS[f].type==='combat').length>=need.bonusFeat; }
function finishCreation(){
  const c = newCharacter({name:CR.name.trim(), race:CR.race, cls:CR.cls, abil:CR.abil, flexAbil:CR.flex, gender:CR.gender, isPlayer:true, portraitSeed:CR.seed});
  c.feats = CR.feats.slice(); c.ai=false;
  c.hp = charStats(c).hpMax; restoreResources(c);
  newGame(c, CR.diff);
}
function quickStart(){
  const c = newCharacter({name:'Aveline Crane', race:'human', cls:'paladin', abil:{...CLASSES.paladin.recommend.abil}, flexAbil:'str', gender:'f', isPlayer:true, portraitSeed:4242});
  applyLevelChoices(c, autoChoices(c,1)); c.ai=false; c.hp=charStats(c).hpMax; restoreResources(c);
  newGame(c,'normal');
}
function newGame(pc, diff){
  G = newGameState(pc, diff);
  saveGame('auto');
  goMap();
  modal({eyebrow:'Act I', title:ACTS[0].title, body:`<div class="prose"><p>${ACTS[0].intro}</p></div>`, buttons:[{label:'Begin',cls:'primary'}], closable:false, onClose:()=>goLoc(G.loc)});
}

function settingsModal(){
  const S=G.settings;
  const body=`<div style="display:flex;flex-direction:column;gap:14px">
  <div class="field"><label for="sd">Difficulty</label><select id="sd">${Object.entries(DIFFICULTY).map(([k,D])=>`<option value="${k}" ${S.difficulty===k?'selected':''}>${D.name} — ${D.desc}</option>`).join('')}</select></div>
  <div class="field"><label for="ss">Animation speed</label><select id="ss">${[[1,'Normal'],[1.5,'Brisk'],[2.5,'Fast'],[5,'Very fast']].map(([v,n])=>`<option value="${v}" ${S.speed==v?'selected':''}>${n}</option>`).join('')}</select></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sa" ${S.autoEnd?'checked':''}> End a character's turn automatically when no actions remain</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sc" ${S.companionAI?'checked':''}> Companions act on their own by default (you can switch each one in battle)</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sl" ${S.autoLevel?'checked':''}> Level up companions automatically</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="slp" ${S.autoLevelPlayer?'checked':''}> Level up my commander automatically too</label>
  </div>`;
  const m=modal({title:'Settings', body, buttons:[{label:'Close',cls:'ghost'},{label:'Apply',cls:'primary',onClick:()=>{ S.difficulty=$('#sd').value; S.speed=+$('#ss').value; S.autoEnd=$('#sa').checked; const ca=$('#sc').checked; if(ca!==S.companionAI){ S.companionAI=ca; for(const c of G.roster) if(!c.isPlayer) c.ai=ca; } S.autoLevel=$('#sl').checked; S.autoLevelPlayer=$('#slp').checked; autoLevelAll(); saveGame('auto'); refreshScreen(); }}]});
}
function saveModal(){
  const rows=['1','2','3'].map(s=>{ const d=readSave(s); return `<div class="invrow"><div class="v"><b>Slot ${s}</b><small>${d? esc(d.label)+' · '+new Date(d.t).toLocaleString():'Empty'}</small></div><button class="btn small" data-save="${s}">Save here</button></div>`; }).join('');
  const code=exportCode();
  const m=modal({title:'Save the Crusade', body:`<div class="inv">${rows}</div><p class="muted" style="font-size:13px">Saves live in this browser. To move your game to another device or keep a backup, copy the save code below and use Load or Import on the title screen.</p><div class="field" style="max-width:none"><label for="exp">Save code</label><textarea id="exp" readonly>${code}</textarea></div>`,
    buttons:[{label:'Close',cls:'ghost'},{label:'Copy save code', keep:true, onClick:()=>{ const ta=$('#exp'); navigator.clipboard?.writeText(ta.value).then(()=>toast('Save code copied.'), ()=>{ ta.select(); toast('Press Ctrl+C to copy the selected code.'); }) ?? (ta.select(), toast('Press Ctrl+C to copy the selected code.')); }},{label:'Quit to title', onClick:()=>{ saveGame('auto'); goTitle(); }}]});
  $$('[data-save]',m.el).forEach(b=>b.onclick=()=>{ const ok=saveGame(b.dataset.save); toast(ok?`Saved to slot ${b.dataset.save}.`:'This browser blocked saving. Copy the save code instead.'); m.close(); });
}

let PS = {uid:null, tab:'sheet'};
function openParty(uid){
  PS.uid = uid || G.party[0];
  const m = modal({eyebrow:'The Crusade', title:'Party', wide:true, body:'<div id="psroot" style="height:100%"></div>', buttons:[], onClose:()=>{ refreshScreen(); checkPendingNotices(); }});
  PS.modal=m; renderParty();
}
function renderParty(){
  const root=$('#psroot'); if(!root) return;
  const c=G.roster.find(x=>x.uid===PS.uid) || G.roster[0]; PS.uid=c.uid;
  const s=charStats(c);
  const needLvl=canLevel(c); const needMyth=c.mythic&&(c.mythic.pending>0||c.mythic.pendingAbil>0);
  const tabs=[['sheet','Sheet'],['gear','Equipment'],['level','Level Up'+(needLvl?'<span class="dot"></span>':'')],['spells','Spells'],['mythic','Mythic'+(needMyth?'<span class="dot"></span>':'')]].filter(([k])=> k!=='spells'||CLASSES[c.cls].cast||oocOptions(c).length).filter(([k])=>k!=='mythic'||c.mythic);
  if(!tabs.some(t=>t[0]===PS.tab)) PS.tab='sheet';
  root.innerHTML=`<div class="pscreen"><div class="plist scroll">${G.roster.map(x=>{ const xs=charStats(x); const f=clamp(x.hp/xs.hpMax,0,1); const act=G.party.includes(x.uid); return `<button class="pmini ${x.uid===c.uid?'sel':''} ${act?'':'benched'}" data-sel="${x.uid}"><img class="portrait" src="${portraitFor(x,36,45)}" alt=""><div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="sub">${CLASSES[x.cls].name} ${x.level}${act?'':' · reserve'}</div><div class="bar"><i style="width:${f*100}%"></i></div>${canLevel(x)?'<div class="lvlstar">Level up</div>':''}</div></button>`; }).join('')}
    <p class="dim" style="font-size:12px;margin:6px 2px">${G.party.length}/6 in the active party.</p></div>
    <div style="min-width:0;display:flex;flex-direction:column">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><img class="portrait" src="${portraitFor(c,64,80)}" width="64" height="80" alt=""><div style="flex:1;min-width:160px"><div style="font-family:var(--f-display);font-size:22px;color:var(--gold-hi)">${esc(c.name)}</div><div class="muted">${RACES[c.race].name} ${CLASSES[c.cls].name} ${c.level}${c.mythic&&c.mythic.path?` · ${MYTHIC_PATHS[c.mythic.path].name} tier ${c.mythic.tier}`:''}</div><div class="dim num" style="font-size:13px">XP ${c.xp.toLocaleString()}${c.level<MAX_LEVEL?` / ${XP_TABLE[c.level+1].toLocaleString()}`:''}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${c.isPlayer?'':`<button class="btn small" id="toggleact">${G.party.includes(c.uid)?'Move to reserve':'Add to party'}</button>`}${c.isPlayer?'':`<button class="btn small ${c.ai?'on':''}" id="toggleai" data-tip="When on, this companion takes their own turns in battle.">Auto: ${c.ai?'On':'Off'}</button>`}</div></div>
      <div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button class="tab ${PS.tab===k?'cur':''}" data-tab="${k}">${n}</button>`).join('')}</div>
      <div class="scroll" style="flex:1;min-height:0" id="pstab"></div></div></div>`;
  $$('[data-sel]',root).forEach(b=>b.onclick=()=>{ PS.uid=b.dataset.sel; renderParty(); });
  $$('[data-tab]',root).forEach(b=>b.onclick=()=>{ PS.tab=b.dataset.tab; renderParty(); });
  const ta=$('#toggleact',root); if(ta) ta.onclick=()=>{ if(G.party.includes(c.uid)) G.party=G.party.filter(x=>x!==c.uid); else if(G.party.length<6) G.party.push(c.uid); else { toast('The party is full. Move someone to the reserve first.'); return; } renderParty(); };
  const tai=$('#toggleai',root); if(tai) tai.onclick=()=>{ c.ai=!c.ai; renderParty(); };
  const tab=$('#pstab',root);
  if(PS.tab==='sheet') tab.innerHTML=sheetHTML(c,s);
  if(PS.tab==='gear') renderGear(tab,c,s);
  if(PS.tab==='level') renderLevel(tab,c);
  if(PS.tab==='spells') renderSpells(tab,c);
  if(PS.tab==='mythic') renderMythicTab(tab,c);
}
function sheetHTML(c,s){
  const P=pcWeaponProfile(c,s);
  const feats=c.feats.map(f=>`<span class="chip" data-tip="${esc(FEATS[f].desc)}">${FEATS[f].name}</span>`).join(' ');
  const feats2=[...c.ragePowers.map(r=>RAGE_POWERS[r]), ...c.talents.map(t=>ROGUE_TALENTS[t])].map(x=>`<span class="chip" data-tip="${esc(x.desc)}">${x.name}</span>`).join(' ');
  const cf=[]; for(let l=1;l<=c.level;l++) for(const f of CLASSES[c.cls].features[l]||[]) if(CLASS_FEATURE_TEXT[f] && !cf.includes(f)) cf.push(f);
  const res=[]; const r=c.res;
  if(r.rage!==undefined) res.push(`Rage ${r.rage}/${r.rageMax} rounds`); if(r.smite!==undefined) res.push(`Smite Evil ${r.smite}/${r.smiteMax}`); if(r.lay!==undefined) res.push(`Lay on Hands ${r.lay}/${r.layMax}`); if(r.channel!==undefined) res.push(`Channel ${r.channel}/${r.channelMax}`); if(r.mp!==undefined) res.push(`Mythic power ${r.mp}/${r.mpMax}`);
  return `<div class="sheet"><div style="display:flex;flex-direction:column;gap:6px"><div class="abilrow" style="grid-template-columns:repeat(2,1fr)">${ABILS.map(k=>`<div class="abil"><div class="k">${k.toUpperCase()}</div><div class="s">${s.abil[k]}</div><div class="m">${fmtMod(s.mod[k])}</div></div>`).join('')}</div></div>
  <div><h3>Defense</h3><dl class="kv"><dt>Hit points</dt><dd class="num">${c.hp} / ${s.hpMax}</dd><dt>Armor Class</dt><dd class="num">${s.ac} <span class="dim">(touch ${s.touch}, flat-footed ${s.ff})</span></dd><dt>Fortitude</dt><dd>${fmtMod(s.saves.fort)}</dd><dt>Reflex</dt><dd>${fmtMod(s.saves.ref)}</dd><dt>Will</dt><dd>${fmtMod(s.saves.will)}</dd>${s.dr.length?`<dt>Damage reduction</dt><dd>${s.dr.map(d=>d.v+'/—').join(', ')}</dd>`:''}${Object.keys(s.resist).length?`<dt>Resistances</dt><dd>${Object.entries(s.resist).map(([k,v])=>k+' '+v).join(', ')}</dd>`:''}</dl>
    <h3 style="margin-top:14px">Offense</h3><dl class="kv"><dt>Base attack</dt><dd>${fmtMod(s.bab)}</dd><dt>${esc(P.name)}</dt><dd class="num">${P.iters.map(fmtMod).join('/')} · ${P.dmg.n}d${P.dmg.d}${fmtMod(P.dmg.b)} · ${P.crit<20?P.crit+'–20':'20'}/×${P.mult}${P.reach>1?' · reach':''}</dd><dt>Initiative</dt><dd>${fmtMod(s.init)}</dd><dt>Speed</dt><dd>${s.speed} ft</dd>${s.cl?`<dt>Caster level</dt><dd>${s.cl} · save DC ${s.dcBase}+spell level${s.asf?` · <span class="bad">${s.asf}% spell failure</span>`:''}</dd>`:''}${!s.armorProf?`<dt class="bad">Armor</dt><dd class="bad">Not proficient: ${s.acp} on attacks</dd>`:''}</dl></div>
  <div><h3>Feats</h3><div style="display:flex;gap:4px;flex-wrap:wrap">${feats||'<span class="dim">None</span>'} ${feats2}</div>
    <h3 style="margin-top:14px">Class features</h3><div style="font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px">${cf.map(f=>`<div>${CLASS_FEATURE_TEXT[f]}</div>`).join('')}</div>
    ${res.length?`<h3 style="margin-top:14px">Daily resources</h3><div style="font-size:13px">${res.join('<br>')}</div>`:''}
    ${c.buffs&&c.buffs.length?`<h3 style="margin-top:14px">Ready for the next battle</h3><div style="display:flex;gap:4px;flex-wrap:wrap">${c.buffs.map(b=>`<span class="chip">${esc(buffLabel(b))}</span>`).join('')}</div>`:''}
    <h3 style="margin-top:14px">Skills</h3><dl class="kv">${Object.entries(SKILLS).map(([k,S])=>`<dt data-tip="${esc(S.desc)}">${S.name}${(CLASS_SKILLS[c.cls]||[]).includes(k)?' <span class="gold">•</span>':''}</dt><dd class="num">${fmtMod(skillBonus(c,k))}</dd>`).join('')}</dl><div class="dim" style="font-size:11.5px">• class skill. Checks use the best bonus in your active party.</div>
    ${c.mythic?`<h3 style="margin-top:14px">Mythic</h3><div style="display:flex;gap:4px;flex-wrap:wrap">${c.mythic.abilities.map(a=>`<span class="chip" data-tip="${esc(MYTHIC_ABILITIES[a].desc)}" style="border-color:rgba(176,96,255,.4)">${MYTHIC_ABILITIES[a].name}</span>`).join('')}</div>`:''}</div></div>`;
}
const SLOT_NAMES={main:'Weapon',off:'Shield',armor:'Armor',ring1:'Ring',ring2:'Ring',neck:'Neck',cloak:'Shoulders',belt:'Belt',head:'Head'};
function slotForItem(c,it){ if(it.kind==='weapon') return 'main'; if(it.kind==='shield') return 'off'; if(it.kind==='armor') return 'armor'; if(it.kind==='wondrous'){ const sl=itemSlotOf(it); if(sl==='ring') return !c.equip.ring1?'ring1': !c.equip.ring2?'ring2':'ring1'; return sl; } return null; }
function itemRow(it, btns){ const U=itemData(it); return `<div class="invrow"><div class="v">${U?`<b class="gold">${esc(itemName(it))}</b>`:esc(itemName(it))}${it.qty>1?' ×'+it.qty:''}<small>${esc(itemDesc(it))}${U?`<br><i>${esc(U.desc)}</i>`:''}</small></div>${btns||''}</div>`; }
function renderGear(tab,c,s){

function restoreResourcesKeep(c){ const old=JSON.parse(JSON.stringify(c.res||{})); restoreResources(c); for(const k of ['rage','smite','lay','channel','mp']) if(old[k]!==undefined && c.res[k]!==undefined) c.res[k]=Math.min(c.res[k], old[k]); if(old.slots) for(const l in c.res.slots) if(old.slots[l]!==undefined) c.res.slots[l]=Math.min(c.res.slots[l], old.slots[l]); for(const k in c.res.grants) if(old.grants && old.grants[k]!==undefined) c.res.grants[k]=old.grants[k]; }

let LV=null;
function renderLevel(tab,c){
  if(!canLevel(c)){ tab.innerHTML=`<p class="muted">${c.level>=MAX_LEVEL?'Maximum level reached.':`${(XP_TABLE[c.level+1]-c.xp).toLocaleString()} more experience to reach level ${c.level+1}.`}</p>`; return; }
  const nl=c.level+1; const need=levelNeeds(c,nl);
  if(!LV || LV.uid!==c.uid || LV.level!==nl) LV={uid:c.uid, level:nl, abil:null, feats:[], ragePowers:[], talents:[]};
  const probe=JSON.parse(JSON.stringify(c)); probe.level=nl; if(LV.abil) probe.abilInc[LV.abil]=(probe.abilInc[LV.abil]||0)+1; probe.feats=c.feats.concat(LV.feats);
  const kinds=[]; for(let i=0;i<need.bonusFeat;i++) kinds.push('bonusFeat'); for(let i=0;i<need.styleFeat;i++) kinds.push('styleFeat'); for(let i=0;i<need.spellFeat;i++) kinds.push('spellFeat'); for(let i=0;i<need.feat;i++) kinds.push('any');
  const labels={bonusFeat:'Bonus combat feat', styleFeat:'Archery style feat', spellFeat:'Bonus spellcasting feat', any:'Feat'};
  const done = (!need.abil||LV.abil) && LV.feats.length===kinds.length && LV.ragePowers.length===need.ragePower && LV.talents.length===need.talent;
  const C=CLASSES[c.cls]; const newFeats=(C.features[nl]||[]).map(f=>CLASS_FEATURE_TEXT[f]).filter(Boolean);
  const hpGain = charStats(probe).hpMax - charStats(c).hpMax;
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div style="font-family:var(--f-display);font-size:20px;color:var(--gold-hi)">Level ${nl}</div><div class="muted">+${hpGain} hit points${C.bab==='full'?' · +1 base attack':''}${newFeats.length?' · '+newFeats.map(t=>t.split(' — ')[0]).join(', '):''}</div></div><div style="display:flex;gap:6px"><button class="btn small" id="lvauto">Choose for me</button><button class="btn primary small" id="lvok" ${done?'':'disabled'}>Confirm level ${nl}</button></div></div><hr class="rule">`;
  if(need.abil){ html+=`<div class="eyebrow">Ability increase (+1)</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px">${ABILS.map(k=>`<button class="btn small ${LV.abil===k?'on':''}" data-la="${k}">${ABIL_NAMES[k]} ${effAbil(c)[k]}${LV.abil===k?' → '+(effAbil(c)[k]+1):''}</button>`).join('')}</div>`; }
  if(kinds.length){
    html+=`<div class="eyebrow">${kinds.map(k=>labels[k]).join(' · ')} <span class="dim">(${LV.feats.length}/${kinds.length} chosen)</span></div><div class="feat-list" style="margin:8px 0 14px">`;
    const nextKind = kinds[LV.feats.length];
    for(const [id,F] of Object.entries(FEATS)){
      const sel=LV.feats.includes(id);
      const ok = sel || (nextKind && featAvailable(probe,id,nextKind==='any'?'any':nextKind));
      if(c.feats.includes(id)) continue;
      html+=`<button class="feat ${sel?'sel':''}" data-lf="${id}" ${ok?'':'disabled'}><b>${F.name}${F.type==='combat'?' <span class="dim" style="font-weight:400">· combat</span>':F.type==='spell'?' <span class="dim" style="font-weight:400">· spell</span>':''}</b><span>${F.desc}</span></button>`;
    }
    html+='</div>';
  }
  if(need.ragePower){ html+=`<div class="eyebrow">Rage power</div><div class="feat-list" style="margin:8px 0 14px">${Object.entries(RAGE_POWERS).filter(([k])=>!c.ragePowers.includes(k)).map(([k,R])=>`<button class="feat ${LV.ragePowers.includes(k)?'sel':''}" data-lr="${k}"><b>${R.name}</b><span>${R.desc}</span></button>`).join('')}</div>`; }

  tab.innerHTML=html;

  $$('[data-lf]',tab).forEach(b=>b.onclick=()=>{ const f=b.dataset.lf; if(LV.feats.includes(f)) LV.feats=LV.feats.slice(0,LV.feats.indexOf(f)); else if(LV.feats.length<kinds.length) LV.feats.push(f); renderParty(); });
  $$('[data-lr]',tab).forEach(b=>b.onclick=()=>{ const k=b.dataset.lr; LV.ragePowers = LV.ragePowers.includes(k)? [] : [k]; renderParty(); });
  $$('[data-lt]',tab).forEach(b=>b.onclick=()=>{ const k=b.dataset.lt; LV.talents = LV.talents.includes(k)? [] : [k]; renderParty(); });
  $('#lvauto',tab).onclick=()=>{ const ch=autoChoices(c,nl); LV.abil=ch.abil; LV.feats=ch.feats; LV.ragePowers=ch.ragePowers; LV.talents=ch.talents; renderParty(); };
  $('#lvok',tab).onclick=()=>{ const wasFresh=c.hp>=charStats(c).hpMax; levelUp(c,{abil:LV.abil, feats:LV.feats, ragePowers:LV.ragePowers, talents:LV.talents}); const oldRes=JSON.parse(JSON.stringify(c.res)); restoreResources(c); if(wasFresh) c.hp=charStats(c).hpMax; LV=null; toast(`${c.name.split(' ')[0]} reaches level ${c.level}.`); saveGame('auto'); renderParty(); };

const terrainCache={};
function mapTerrain(actIdx, pal){
  if(terrainCache[actIdx]) return terrainCache[actIdx];
  const W=640, H=400; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const r=seeded(actIdx*97+11);
  const N=33, grid=[]; for(let i=0;i<N*N;i++) grid.push(r());
  const val=(x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const g=(a,b)=>grid[((b%N+N)%N)*N+((a%N+N)%N)]; const sm=t=>t*t*(3-2*t); const u=sm(xf), v=sm(yf); return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v; };
  const fbm=(x,y)=>{ let a=0, f=1, amp=0.5; for(let o=0;o<5;o++){ a+=val(x*f,y*f)*amp; f*=2.03; amp*=0.5; } return a; };
  const img=c.createImageData(W,H); const hm=new Float32Array(W*H);
  const base=[pal[0],pal[1]].map(h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; });
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const e=fbm(x/90,y/90); hm[y*W+x]=e;
    const k=clamp((e-0.3)/0.5,0,1);
    const dx=(x/W-0.5), dy=(y/H-0.5); const vig=1-clamp(Math.hypot(dx*1.1,dy*1.3)*1.2,0,0.75);
    const i=(y*W+x)*4; const lt = 0.55+k*0.9;
    img.data[i]=Math.min(255,(base[1][0]+(base[0][0]-base[1][0])*k)*lt*vig+8); img.data[i+1]=Math.min(255,(base[1][1]+(base[0][1]-base[1][1])*k)*lt*vig+6); img.data[i+2]=Math.min(255,(base[1][2]+(base[0][2]-base[1][2])*k)*lt*vig+4); img.data[i+3]=255;
  }
  // hillshade
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const s=(hm[y*W+x+1]-hm[y*W+x-1]) + (hm[(y+1)*W+x]-hm[(y-1)*W+x]); const i=(y*W+x)*4; const f=1-s*6; img.data[i]*=f; img.data[i+1]*=f; img.data[i+2]*=f; }
  c.putImageData(img,0,0);
  // contour lines
  c.fillStyle='rgba(236,212,154,0.07)';
  for(let y=1;y<H;y+=1) for(let x=1;x<W;x+=1){ const a=hm[y*W+x], b=hm[y*W+x-1], d=hm[(y-1)*W+x]; for(const lv of [0.5,0.62]){ if((a-lv)*(b-lv)<0 || (a-lv)*(d-lv)<0){ c.fillRect(x,y,1,1); break; } } }
  // mountains
  for(let i=0;i<260;i++){ const x=r()*W, y=r()*H; const e=hm[(y|0)*W+(x|0)]; if(e<0.6) continue; const s=5+ (e-0.6)*40; c.fillStyle='rgba(0,0,0,0.35)'; c.beginPath(); c.moveTo(x-s,y+s*0.4); c.lineTo(x,y-s); c.lineTo(x+s,y+s*0.4); c.fill(); c.fillStyle='rgba(255,236,200,0.12)'; c.beginPath(); c.moveTo(x-s,y+s*0.4); c.lineTo(x,y-s); c.lineTo(x-s*0.1,y+s*0.4); c.fill(); }
  // scrub / dead trees in lowlands
  c.strokeStyle='rgba(10,5,3,0.5)'; c.lineWidth=1;
  for(let i=0;i<500;i++){ const x=r()*W, y=r()*H; const e=hm[(y|0)*W+(x|0)]; if(e>0.45||e<0.3) continue; c.beginPath(); c.moveTo(x,y); c.lineTo(x+(r()-0.5)*2,y-3-r()*3); c.stroke(); }
  // rift fissures
  c.save(); c.shadowColor=pal[2]; c.shadowBlur=6; c.strokeStyle=hexA(pal[2],0.55); c.lineWidth=1.2;
  for(let k=0;k<7+actIdx*2;k++){ let x=W*(0.55+r()*0.45), y=H*r()*0.6; c.beginPath(); c.moveTo(x,y); for(let j=0;j<10;j++){ x+=(r()-0.7)*18; y+=(r()-0.3)*14; c.lineTo(x,y);} c.stroke(); }
  c.restore();
  // old roads
  c.strokeStyle='rgba(20,12,8,0.45)'; c.setLineDash([3,3]); c.lineWidth=1.5; for(let k=0;k<3;k++){ c.beginPath(); let x=0, y=H*(0.3+k*0.25); c.moveTo(x,y); while(x<W){ x+=20; y+=(r()-0.5)*16; c.lineTo(x,y);} c.stroke(); } c.setLineDash([]);
  // paper grain

async function travelTo(dest){

  for(let i=1;i<path.length;i++){
    const a=findLoc(path[i-1]), b=findLoc(path[i]);
    await new Promise(res=>{ token={anim:true, start:performance.now(), dur:650/Math.max(1,G.settings.speed*0.8), ax:L.px(a), ay:L.py(a), bx:L.px(b), by:L.py(b), done:res}; });

function roadAmbush(enc, at){

      buttons:[{label:`Slip away [Mobility ${dc}] · ${odds}%`, onClick:()=>{ const r=skillCheck('mobility',dc); toast(checkText(r),3000); if(r.ok){ res('continue'); } else { startEncounterBattle(enc, at, ()=>res('stop')); } }},{label:'Fight', cls:'primary', onClick:()=>startEncounterBattle(enc, at, ()=>res('stop'))}]});

  $('#l-map').onclick=()=>{ G._lastScreen='map'; goMap(); };

//  POINTS OF INTEREST
// ============================================================
function openPoi(loc, poi){
  hideTip();
  const st=pst(loc.id,poi.id); st.seen=true;
  if(!poiReqMet(loc,poi)){ toast(poi.reqText||'You cannot do that yet.', 2400); return; }
  if(poi.type==='merchant') return openMerchant(poi.merchant, poi.name);
  if(poi.type==='inn') return modal({eyebrow:loc.name, title:poi.name, body:`<p class="prose">${poi.text||'A safe place to rest.'} Resting here is free and restores hit points, spells and daily abilities.</p>`, buttons:[{label:'Not now',cls:'ghost'},{label:'Rest',cls:'primary',onClick:()=>{ restParty(); saveGame('auto'); renderLocUI(); toast('The party is rested.'); }}]});
  if(poi.type==='board') return hireModal();
  if(poiDone(loc,poi)){
    if(poi.type==='battle') return modal({eyebrow:loc.name, title:poi.name, body:`<p class="prose">The fight here is over.</p>`, buttons:[{label:'Close'}]});
    return modal({eyebrow:loc.name, title:poi.name, body:`<div class="prose"><p>${poi.text||'There is nothing more to do here.'}</p><p class="muted">Done.</p></div>`, buttons:[{label:'Close'}]});
  }
  if(poi.type==='battle'){
    if(poi.talk && !st.talked) return runTalk(poi.talk, loc, poi);
    return confirmBattle(loc, poi);
  }
  if(poi.type==='npc') return runTalk(poi.talk, loc, poi);
  if(poi.type==='lore'||poi.type==='story'){
    return modal({eyebrow:loc.name, title:poi.name, closable:false, body:`<div class="prose"><p>${poi.text}</p></div>`, buttons:[{label:'Continue',cls:'primary',onClick:()=>{ st.done=true; const out=applyFx(poi.fx||[],{loc,poi}); afterFx(out, loc); }}]});
  }
  if(poi.type==='check'){ if(poi.talk) return runTalk(poi.talk, loc, poi); return openCheck(loc, poi); }
  if(poi.type==='chest') return openChest(loc, poi);
}
function oddsFor(sk, dc){ const b=partyBest(sk); return {b, pct:Math.round(clamp((21-(dc-b.bonus))/20,0.05,1)*100)}; }
function checkLabel(sk, dc){ const o=oddsFor(sk,dc); return `${SKILLS[sk].name} ${dc} · ${o.b.c.name.split(' ')[0]} ${fmtMod(o.b.bonus)} · ${o.pct}%`; }
function openCheck(loc, poi){
  const st=pst(loc.id,poi.id); const C=poi.check; const lvl=playerChar().level;
  const blocked = st.failLvl!==undefined && st.failLvl>=lvl;
  modal({eyebrow:loc.name, title:poi.name, body:`<div class="prose"><p>${poi.text}</p>${blocked?'<p class="muted">You have already tried. Come back when your party has grown stronger.</p>':''}</div>`,
    buttons:[{label:'Leave',cls:'ghost'},{label:`Attempt: ${checkLabel(C.skill,C.dc)}`, cls:'primary', disabled:blocked, onClick:()=>{
      const r=skillCheck(C.skill,C.dc);
      if(r.ok){ st.done=true; const out=applyFx(C.ok.fx||[],{loc,poi}); resultModal(loc, poi.name, r, C.ok.text, out); }
      else { const out=applyFx(C.fail.fx||[],{loc,poi}); if(C.fail.retry) st.failLvl=lvl; else st.done=true; resultModal(loc, poi.name, r, C.fail.text+(C.fail.retry?' <span class="muted">(You can try again after gaining a level.)</span>':''), out); }
    }}]});
}
function resultModal(loc, title, r, text, out){
  modal({eyebrow:loc.name, title, closable:false, body:`<div class="dlg">${r?`<div class="roll ${r.ok?'':'bad'}">${esc(checkText(r))}</div>`:''}<div class="prose"><p>${text}</p></div>${rewardLines(out)}</div>`, buttons:[{label:'Continue',cls:'primary',onClick:()=>afterFx(out, loc)}]});
}
function rewardLines(out){
  if(!out) return '';
  const L=[];
  if(out.xp) L.push(`<div class="invrow"><div class="v">Experience${out.questXp?' <span class="dim">(quest progress)</span>':''}</div><b class="gold num">+${out.xp.toLocaleString()} XP</b></div>`);
  if(out.gold>0) L.push(`<div class="invrow"><div class="v">Gold</div><b class="gold num"><span class="coin"></span>+${out.gold.toLocaleString()}</b></div>`);
  for(const it of out.items||[]) L.push(itemRow(it));
  for(const c of out.recruits||[]) L.push(`<div class="invrow"><div class="v"><b class="gold">${esc(c.name)}</b> joins your party<small>${esc(COMPANIONS[c.companionId]?.blurb||'')}</small></div></div>`);
  for(const m of out.msgs||[]) L.push(`<div class="invrow"><div class="v">${m}</div></div>`);
  return L.length? `<div class="loot" style="margin-top:8px">${L.join('')}</div>` : '';
}
function afterFx(out, loc){
  saveGame('auto');
  if(out && out.endAct){ return finishAct(); }
  if(out && out.ending){ return showEnding(); }
  if(loc){ const msgs=recheckHidden(loc); locDisc=msgs; renderLocUI(); }
  else refreshScreen();
  checkPendingNotices();
}

// ---------- dialogue ----------
function runTalk(talk, loc, poi, startNode){
  const st=pst(loc.id,poi.id);
  let nodeId = startNode || talk.start; let rollLine=null; let lastOut=null;
  const m = modal({eyebrow:loc.name, title:poi.name, closable:true, body:'<div class="dlg" id="dlgbody"></div>'});
  const render=()=>{
    const node=talk.nodes[nodeId];
    if(!node){ m.close(); return; }
    st.nodesSeen ||= {}; let out=null; if(node.fx && !st.nodesSeen[nodeId]){ out=applyFx(node.fx,{loc,poi}); } st.nodesSeen[nodeId]=true;
    const body=$('#dlgbody',m.el);
    const opts=node.opts||[];
    body.innerHTML = `${rollLine?`<div class="roll ${rollLine.ok?'':'bad'}">${esc(checkText(rollLine))}</div>`:''}${node.speaker?`<div class="speaker">${esc(node.speaker)}</div>`:''}<div class="prose"><p>${node.text}</p></div>${rewardLines(mergeOut(lastOut,out))}
      <div class="opts">${opts.map((o,i)=>{ const ok=optAvailable(o); if(!ok && !o.reqText && !(o.req&&(o.req.companion||o.req.item))) return ''; let label=esc(o.t);
        if(o.check){ const od=oddsFor(o.check[0],o.check[1]); label=label.replace(/^\[([^\]]+)\]\s*/,''); label=`<span class="ck">[${SKILLS[o.check[0]].name} ${o.check[1]}]</span> ${label}<span class="odds">${od.b.c.name.split(' ')[0]} ${fmtMod(od.b.bonus)} · ${od.pct}%</span>`; }
        st.failed ||= {}; const fk=nodeId+':'+i; const tried = o.check && st.failed[fk]!==undefined && st.failed[fk]>=playerChar().level; if(tried){ label+=' <span class="dim">(already tried — try again after gaining a level)</span>'; }
        if(!ok) label+=` <span class="dim">${esc(o.reqText || (o.req.companion? `(requires ${COMPANIONS[o.req.companion].name.split(' ')[0]} in your party)` : o.req.item? '(requires an item)' : o.req.gold? `(requires ${o.req.gold} gold)` : ''))}</span>`;
        return `<button class="opt" data-o="${i}" ${ok&&!tried?'':'disabled'}>${label}</button>`; }).join('')}</div>`;
    lastOut=null;
    $$('[data-o]',body).forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.o];
      st.optsTaken ||= {}; const okey=nodeId+':'+b.dataset.o; let out2 = (o.fx && !st.optsTaken[okey])? applyFx(o.fx,{loc,poi}) : null; if(o.fx) st.optsTaken[okey]=true;
      if(o.battle){ st.talked=true; m.close(); if(out2 && (out2.recruits.length||out2.msgs.length)) toast(out2.recruits.map(c=>c.name+' joins you.').join(' ')||'',2200); startPoiBattle(loc, poi); return; }
      if(o.check){ const r=skillCheck(o.check[0],o.check[1]); rollLine=r; if(!r.ok){ st.failed ||= {}; st.failed[nodeId+':'+b.dataset.o]=playerChar().level; } if(r.ok){ if(o.okfx && !st.optsTaken[okey+':ok']){ st.optsTaken[okey+':ok']=true; out2=mergeOut(out2, applyFx(o.okfx,{loc,poi})); } nodeId=o.ok; } else nodeId=o.fail; lastOut=out2; render(); return; }
      rollLine=null;
      if(o.end || !o.go){ m.close(); if(poi.type==='npc' && !poi.stay && nodeHasDoneOrEnd(talk)) {} afterFx(out2, loc); return; }
      nodeId=o.go; lastOut=out2; render();
    });
    if(out && (out.endAct||out.ending)){ /* handled when leaving */ }
  };
  render();
}
function nodeHasDoneOrEnd(){ return true; }
function mergeOut(a,b){ if(!a) return b; if(!b) return a; return {msgs:[...a.msgs,...b.msgs], items:[...a.items,...b.items], gold:a.gold+b.gold, xp:a.xp+b.xp, questXp:(a.questXp||0)+(b.questXp||0), recruits:[...a.recruits,...b.recruits], endAct:a.endAct||b.endAct, ending:a.ending||b.ending}; }

// ---------- chests ----------
function openChest(loc, poi){
  const st=pst(loc.id,poi.id); const ch=poi.chest; const lvl=playerChar().level;
  const step=()=>{
    // trap
    if(ch.trap && !st.trapDone){
      const tr=chestTrapCheck(loc,poi);
      if(tr.detected){
        return modal({eyebrow:loc.name, title:poi.name, closable:false, body:`<div class="dlg">${tr.res?`<div class="roll">${esc(checkText(tr.res))}</div>`:''}<div class="prose"><p>${poi.text}</p><p><b class="bad">Trap!</b> ${tr.res?tr.res.who.name.split(' ')[0]+' spots':'You remember'} a ${esc(ch.trap.name||'trap')} protecting it.</p></div></div>`,
          buttons:[{label:'Leave it',cls:'ghost'},{label:'Set it off from a distance',onClick:()=>{ const t=chestTrigger(loc,poi); toast(t,3200); setTimeout(step,50); }},{label:`Disarm: ${checkLabel('thievery',ch.trap.disarm)}`, cls:'primary', onClick:()=>{ const r=chestDisarm(loc,poi); toast(r.text,3200); setTimeout(step,50); }}]});
      } else { const t=chestTrigger(loc,poi); toast(t, 3400); }
    }
    if(chestLocked(loc,poi)){
      const blocked = st.lockFail!==undefined && st.lockFail>=lvl;
      return modal({eyebrow:loc.name, title:poi.name, body:`<div class="prose"><p>${poi.text}</p><p class="muted">It is locked.${blocked?' You have already tried everything you know. Come back after gaining a level.':''}</p></div>`,
        buttons:[{label:'Leave',cls:'ghost'},{label:`Force it: ${checkLabel('athletics',ch.lock+4)}`, disabled:blocked, onClick:()=>{ const r=chestUnlock(loc,poi,'force'); toast(checkText(r),3000); if(r.ok) setTimeout(step,50); else refreshScreen(); }},{label:`Pick the lock: ${checkLabel('thievery',ch.lock)}`, cls:'primary', disabled:blocked, onClick:()=>{ const r=chestUnlock(loc,poi,'pick'); toast(checkText(r),3000); if(r.ok) setTimeout(step,50); else refreshScreen(); }}]});
    }
    const out=chestLoot(loc,poi);
    resultModal(loc, poi.name, null, poi.text, out);
  };
  step();
}

    buttons:[{label:'Not yet',cls:'ghost'},{label:'Fight',cls:'primary',onClick:()=>startPoiBattle(loc,poi)}]});

function startPoiBattle(loc, poi){

function showRewards(title, rew, then){

    ${(rew.fx.msgs||[]).map(m=>`<div class="invrow"><div class="v">${m}</div></div>`).join('')}${lv}${ready}</div>`,

function openJournal(){
  const entries=Object.entries(G.quests).map(([id,st])=>({id,st,Q:QUESTS[id]})).filter(e=>e.Q);
  const active=entries.filter(e=>e.st!=='done').sort((a,b)=>(b.Q.main-a.Q.main)||(b.Q.act-a.Q.act));
  const done=entries.filter(e=>e.st==='done').sort((a,b)=>b.Q.act-a.Q.act);
  const q=e=>`<div class="jq ${e.Q.main?'main':''} ${e.st==='done'?'done':''}"><h4>${esc(e.Q.name)}</h4><div class="muted" style="font-size:12px;margin-bottom:4px">Act ${ACTS[e.Q.act].num}${e.Q.main?' · main quest':''}</div><div>${e.Q.stages[e.st]}</div></div>`;
  const chron = ACTS.slice(0,G.actIdx+1).map((a,i)=>`<h3 style="font-size:16px;color:var(--gold-hi);margin:10px 0 4px">Act ${a.num}: ${a.title}</h3><p>${a.intro}</p>${i<G.actIdx&&a.outro?`<p>${a.outro}</p>`:''}`).join('');
  const m=modal({eyebrow:'Journal', title:'The Crusade', wide:true, body:`<div class="tabs"><button class="tab cur" data-jt="q">Quests</button><button class="tab" data-jt="c">Chronicle</button><button class="tab" data-jt="p">Companions</button></div><div id="jbody"></div>`, buttons:[{label:'Close'}]});
  const comp = G.roster.filter(c=>c.companionId).map(c=>`<div class="jq"><h4>${esc(c.name)}</h4><div class="muted" style="font-size:12px">${RACES[c.race].name} ${CLASSES[c.cls].name} ${c.level}</div><div style="margin-top:4px">${esc(COMPANIONS[c.companionId].blurb)}</div><div class="dim" style="margin-top:4px;font-family:var(--f-body);font-style:italic">${esc(COMPANIONS[c.companionId].line)}</div></div>`).join('') || '<p class="dim">No companions yet.</p>';
  const show_=k=>{ $('#jbody',m.el).innerHTML = k==='q'? `${active.length?active.map(q).join(''):'<p class="dim">No active quests.</p>'}${done.length?`<div class="eyebrow" style="margin:14px 0 6px">Completed</div>${done.map(q).join('')}`:''}` : k==='c'? `<div class="prose">${chron}</div>` : comp; $$('[data-jt]',m.el).forEach(b=>b.classList.toggle('cur',b.dataset.jt===k)); };
  $$('[data-jt]',m.el).forEach(b=>b.onclick=()=>show_(b.dataset.jt));
  show_('q');
}

function openMerchant(mdef, name){
  const m=modal({eyebrow:(mdef.types.map(t=>MERCH_TYPES[t].title).join(' · ')), title:name, wide:true, body:'<div id="shroot"></div>', buttons:[{label:'Done'}], onClose:()=>refreshScreen()});
  let tab='buy';
  const cats=[['unique','Rare wares'],['weapon','Weapons'],['armor','Armor and shields'],['wondrous','Wondrous items'],['scroll','Scrolls'],['potion','Potions']];
  const render=()=>{
    const root=$('#shroot',m.el); if(!root) return;
    const st=merchantStock(mdef);
    const items = st.generic.map(s=>({spec:s, it:specToItem(s)})).concat(st.uniques.map(u=>({uid:u, it:mkUnique(u)})));
    const sellable = G.inventory.filter(i=>i.kind!=='quest');
    const junkTotal = G.inventory.filter(i=>i.kind==='junk').reduce((s,i)=>s+JUNK[i.base].value*(i.qty||1),0);
    root.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div class="tabs" style="margin:0;border:0"><button class="tab ${tab==='buy'?'cur':''}" data-tab="buy">Buy</button><button class="tab ${tab==='sell'?'cur':''}" data-tab="sell">Sell</button></div><div class="gold-box" style="padding:0"><span class="coin"></span><b class="num">${G.gold.toLocaleString()}</b> <span class="supply" style="margin-left:10px">${icon('tent').replace('<svg','<svg style="width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.7"')}<b class="num">${G.supplies}</b></span></div></div>
    <div id="shlist"></div>`;
    const list=$('#shlist',root);
    if(tab==='buy'){
      let html='';
      if(mdef.supplies) html+=`<div class="eyebrow" style="margin:6px 0">Provisions</div><div class="inv"><div class="invrow"><div class="v">Camping Supplies<small>One set lets the party rest outside a town.</small></div><b class="num">${SUPPLY_PRICE}</b><button class="btn small" id="buysup" ${G.gold<SUPPLY_PRICE?'disabled':''}>Buy</button></div></div>`;
      for(const [k,n] of cats){ const rows=items.filter(x=> k==='unique'? !!x.uid : !x.uid && (x.it.kind===k || (k==='armor'&&x.it.kind==='shield'))); if(!rows.length) continue;
        html+=`<div class="eyebrow" style="margin:12px 0 6px">${n}</div><div class="inv">${rows.map((x,i)=>{ const p=buyPrice(x.it,mdef); return itemRow(x.it, `<b class="num" style="white-space:nowrap">${p.toLocaleString()}</b><button class="btn small" data-buy="${items.indexOf(x)}" ${G.gold<p?'disabled':''}>Buy</button>`); }).join('')}</div>`; }
      list.innerHTML=html;
      const sb=$('#buysup',list); if(sb) sb.onclick=()=>{ if(G.gold<SUPPLY_PRICE) return; G.gold-=SUPPLY_PRICE; G.supplies++; render(); };
