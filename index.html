<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember of the Sundering</title>
<meta name="description" content="A browser tactical RPG built on the Pathfinder 1e open rules: a crusade against the Abyss in six acts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: full-bleed game surfaces (canvas) with ornamented gilt panels floating over them. */
:root{
  --ink:#0b0807; --panel:#15100d; --panel-2:#1e1612; --panel-3:#271c16;
  --line:#5c4527; --line-soft:#3a2b1a; --gold:#c9a45c; --gold-hi:#ecd49a; --bone:#e9e0cf; --muted:#a09280; --dim:#76695a;
  --blood:#8e201c; --blood-hi:#c23a2e; --ember:#ff7a2a; --rift:#b060ff; --ok:#7fcf8c; --bad:#e25a4a; --mana:#7ea6ff;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif; --f-body:"Alegreya",Georgia,serif; --f-ui:"Alegreya Sans",system-ui,sans-serif; --f-sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --r:3px; color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{position:relative;height:100%;width:100%;overflow:hidden;}
.screen{position:absolute;inset:0;}
button{font-family:var(--f-sc);letter-spacing:.06em;cursor:pointer;color:var(--bone);}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;}
.btn{position:relative;background:linear-gradient(#2c2019,#18110d);border:1px solid var(--line);border-radius:var(--r);padding:.55em 1.1em;font-size:14px;font-weight:700;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(236,212,154,.14),inset 0 0 0 1px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);transition:border-color .15s,background .15s,transform .05s;}
.btn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(#3a2a1f,#1d1510);}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn.primary{background:linear-gradient(#8e201c,#4e110e);border-color:#c9a45c;color:#fff4dc;}
.btn.primary:hover:not(:disabled){background:linear-gradient(#a8291f,#5e1511);}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line-soft);}
.btn.small{font-size:12px;padding:.35em .7em;}
.btn.on{border-color:var(--gold-hi);background:linear-gradient(#4a3a20,#261c10);color:var(--gold-hi);}
.panel{background:linear-gradient(180deg,rgba(28,21,17,.97),rgba(15,11,9,.97));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 3px rgba(201,164,92,.08),0 12px 40px rgba(0,0,0,.65);position:relative;}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);background:var(--panel);top:-5px;left:calc(50% - 5px);}
.panel::after{top:auto;bottom:-5px;}
.panel.plain::before,.panel.plain::after{display:none;}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;margin:0;text-wrap:balance;}
.eyebrow{font-family:var(--f-sc);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0;border:0;}
.muted{color:var(--muted);} .dim{color:var(--dim);} .ok{color:var(--ok);} .bad{color:var(--bad);} .gold{color:var(--gold-hi);}
.num{font-variant-numeric:tabular-nums;}
.prose{font-family:var(--f-body);font-size:17px;line-height:1.6;max-width:62ch;}
.prose p{margin:0 0 .8em;}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border:1px solid var(--line-soft);border-radius:10px;background:rgba(0,0,0,.35);white-space:nowrap;}
.pips{display:inline-flex;gap:3px;}
.pip{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--gold);background:var(--gold);}
.pip.off{background:transparent;opacity:.45;}
.pip.mp{border-color:var(--rift);background:var(--rift);}
.pip.mp.off{background:transparent;}
.portrait{display:block;border:1px solid var(--line);border-radius:2px;background:#000;object-fit:cover;}
.bar{height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.8);border-radius:1px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--ok);}

/* ---------- title ---------- */
#scr-title canvas{position:absolute;inset:0;width:100%;height:100%;}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-inline:16px;text-align:center;}
.title-wrap h1{font-size:clamp(34px,6.4vw,78px);font-weight:700;letter-spacing:.08em;line-height:1.05;color:#f3e6c6;text-shadow:0 0 24px rgba(255,110,40,.35),0 2px 0 #2a1208,0 6px 30px rgba(0,0,0,.9);}
.title-wrap h1 small{display:block;font-size:.3em;letter-spacing:.42em;color:var(--gold);margin-bottom:.6em;font-weight:600;}
.title-menu{display:flex;flex-direction:column;gap:10px;min-width:min(300px,80vw);}
.title-menu .btn{font-size:15px;padding:.75em 1.2em;}
.title-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);padding-inline:16px;}

/* ---------- creation ---------- */
#scr-create{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:16px;padding:16px;background:radial-gradient(ellipse at 70% 0%,#2a120c,#0b0807 60%);}
.steps{display:flex;flex-direction:column;gap:4px;padding:16px 12px;}
.steps .step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:2px;font-family:var(--f-sc);letter-spacing:.08em;color:var(--muted);border:1px solid transparent;background:none;text-align:left;font-size:14px;}
.steps .step b{font-family:var(--f-display);color:var(--gold);width:22px;}
.steps .step.cur{border-color:var(--line);color:var(--gold-hi);background:rgba(201,164,92,.07);}
.steps .step.done{color:var(--bone);}
.create-main{display:flex;flex-direction:column;min-width:0;padding:18px 20px;gap:14px;}
.create-main .body{flex:1;min-height:0;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.card{border:1px solid var(--line-soft);background:linear-gradient(#1c1511,#120d0b);padding:12px 14px;border-radius:2px;text-align:left;color:var(--bone);font-family:var(--f-ui);letter-spacing:0;display:flex;flex-direction:column;gap:6px;}
.card h3{font-size:17px;color:var(--gold-hi);}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4;}
.card:hover{border-color:var(--line);}
.card.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(236,212,154,.25),0 0 24px rgba(201,164,92,.15);background:linear-gradient(#2a1e14,#15100c);}
.card .meta{font-size:12px;color:var(--gold);font-family:var(--f-sc);letter-spacing:.06em;}
.abil-table{display:grid;grid-template-columns:minmax(120px,1fr) auto 50px auto 60px 60px;gap:8px 12px;align-items:center;max-width:620px;}
.abil-table .h{font-family:var(--f-sc);font-size:12px;color:var(--gold);letter-spacing:.1em;}
.abil-table .v{font-family:var(--f-display);font-size:22px;text-align:center;}
.sq{width:32px;height:32px;padding:0;font-size:18px;}
.create-side{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;}
.statgrid{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px;}
.statgrid dt{color:var(--muted);} .statgrid dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;}
.feat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;}
.feat{border:1px solid var(--line-soft);padding:8px 10px;background:rgba(0,0,0,.25);text-align:left;font-family:var(--f-ui);letter-spacing:0;color:var(--bone);border-radius:2px;}
.feat b{display:block;color:var(--gold-hi);font-weight:700;font-size:14px;}
.feat span{font-size:12.5px;color:var(--muted);}
.feat.sel{border-color:var(--gold);background:rgba(201,164,92,.1);}
.feat:disabled{opacity:.35;}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px;}
.field label{font-family:var(--f-sc);letter-spacing:.1em;font-size:12px;color:var(--gold);}
input[type=text],select,textarea{background:#0e0a08;border:1px solid var(--line);color:var(--bone);padding:.55em .7em;border-radius:2px;font-family:var(--f-ui);font-size:15px;}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:12px;}

/* ---------- campaign ---------- */
#scr-map canvas{position:absolute;inset:0;width:100%;height:100%;}
.map-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;gap:12px;pointer-events:none;}
.map-top>*{pointer-events:auto;}
.act-title .eyebrow{display:block;}
.act-title h2{font-size:clamp(22px,3vw,34px);color:#f1e3c3;text-shadow:0 2px 12px rgba(0,0,0,.9);}
.gold-box{padding:8px 14px;display:flex;gap:14px;align-items:center;font-family:var(--f-sc);letter-spacing:.06em;}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#b88a2e);border:1px solid #6a4a14;vertical-align:-1px;margin-right:4px;}
.party-col{position:absolute;left:16px;top:96px;display:flex;flex-direction:column;gap:8px;}
.pmini{display:flex;gap:8px;align-items:center;padding:5px 8px 5px 5px;background:rgba(12,9,8,.85);border:1px solid var(--line-soft);border-radius:2px;min-width:180px;color:var(--bone);font-family:var(--f-ui);letter-spacing:0;text-align:left;}
.pmini:hover{border-color:var(--line);}
.pmini img{width:36px;height:45px;}
.pmini .nm{font-size:13px;font-weight:700;line-height:1.1;}
.pmini .sub{font-size:11px;color:var(--muted);}
.pmini .bar{width:110px;margin-top:3px;}
.lvlstar{color:var(--ember);font-size:11px;font-family:var(--f-sc);letter-spacing:.08em;}
.map-bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.8));}

/* ---------- battle ---------- */
#scr-battle canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.init-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px 8px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;}
.init-bar .ini{position:relative;flex:0 0 auto;width:42px;height:52px;border:1px solid var(--line-soft);border-radius:2px;overflow:hidden;background:#000;padding:0;}
.init-bar .ini img{width:100%;height:100%;object-fit:cover;}
.init-bar .ini.enemy{border-color:#6a2a22;}
.init-bar .ini.party{border-color:#3a5a3a;}
.init-bar .ini.cur{border-color:var(--gold-hi);box-shadow:0 0 12px rgba(236,212,154,.5);transform:translateY(2px);}
.init-bar .ini.down{opacity:.3;filter:grayscale(1);}
.init-bar .ini i{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.7);}
.init-bar .ini i b{display:block;height:100%;}
.round-lbl{position:absolute;top:14px;left:16px;font-family:var(--f-sc);letter-spacing:.12em;font-size:13px;padding:6px 12px;}
.round-lbl b{font-family:var(--f-display);color:var(--gold-hi);font-size:15px;}
.bmenu{position:absolute;top:14px;right:16px;display:flex;gap:6px;}
.hud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:stretch;padding:10px;max-width:calc(100% - 20px);}
.ucard{display:flex;gap:10px;min-width:0;}
.ucard img{width:64px;height:80px;}
.ucard .info{display:flex;flex-direction:column;gap:3px;min-width:150px;}
.ucard .nm{font-family:var(--f-display);font-size:15px;color:var(--gold-hi);line-height:1.1;}
.ucard .sub{font-size:12px;color:var(--muted);}
.ucard .hpt{font-size:12px;font-variant-numeric:tabular-nums;}
.acts{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11px;color:var(--muted);font-family:var(--f-sc);letter-spacing:.06em;}
.acts span{display:inline-flex;gap:4px;align-items:center;}
.abar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:620px;}
.ab{width:52px;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;line-height:1;letter-spacing:.04em;}
.ab svg{width:22px;height:22px;stroke:var(--gold-hi);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ab.on svg{stroke:#fff;}
.endturn{align-self:stretch;min-width:92px;font-size:14px;}
.conds{display:flex;gap:3px;flex-wrap:wrap;max-width:200px;}
.pop{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));max-height:min(420px,55vh);padding:12px;display:flex;flex-direction:column;gap:8px;}
.pop .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;}
.sp{display:flex;flex-direction:column;gap:2px;padding:7px 9px;text-align:left;border:1px solid var(--line-soft);background:rgba(0,0,0,.3);font-family:var(--f-ui);letter-spacing:0;border-radius:2px;color:var(--bone);}
.sp b{font-size:13.5px;color:var(--gold-hi);}
.sp span{font-size:11.5px;color:var(--muted);}
.sp:hover:not(:disabled){border-color:var(--gold);}
.sp:disabled{opacity:.35;}
.lvl-h{font-family:var(--f-sc);letter-spacing:.12em;font-size:12px;color:var(--gold);display:flex;justify-content:space-between;margin-top:4px;}
.logp{position:absolute;right:12px;top:78px;bottom:130px;width:340px;display:flex;flex-direction:column;}
.logp .lg{flex:1;padding:8px 10px;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column;gap:3px;}
.logp .lg div{padding:1px 0;}
.logp .lg .round{font-family:var(--f-sc);color:var(--gold);letter-spacing:.14em;text-align:center;margin-top:4px;}
.logp .lg .head{color:var(--gold-hi);}
.logp .lg .dim{color:var(--dim);}
.logp .lg b.lp{color:#a8e0a8;} .logp .lg b.le{color:#ff9a88;}
.logp .lg .hit b.hit{color:#ffd8a0;} .logp .lg b.crit{color:#ffcf3a;}
.logp .lg .miss{color:#b8ab98;}
.logp .lg .heal b,.logp .lg .ok{color:var(--ok);}
.logp .lg .bad{color:#ff8070;}
.logp .lg .kill{color:#ff7a5a;}
.logp .lg b.spn{color:#d0b0ff;}
.logp .lg .aoo{color:#ffb070;}
.logp .lg .buff{color:#e8d49a;}
.tip{position:absolute;pointer-events:none;z-index:40;max-width:300px;padding:10px 12px;font-size:13px;line-height:1.4;}
.tip h4{margin:0 0 4px;font-family:var(--f-display);font-size:14px;color:var(--gold-hi);font-weight:600;}
.tip .row{display:flex;justify-content:space-between;gap:12px;}
.toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);padding:8px 16px;font-family:var(--f-sc);letter-spacing:.08em;font-size:13px;z-index:30;}
.banner{position:absolute;top:34%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:clamp(26px,4vw,44px);color:#f6e7c4;letter-spacing:.14em;text-shadow:0 0 30px rgba(255,120,40,.5),0 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .4s;}
.banner.show{opacity:1;}

/* ---------- modal ---------- */
.modal-bg{position:absolute;inset:0;background:rgba(5,3,2,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px);}
.modal{width:min(760px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;}
.modal.wide{width:min(1120px,100%);height:calc(100% - 20px);}
.modal .mh{padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal .mh h2{font-size:22px;color:var(--gold-hi);}
.modal .mb{padding:4px 20px 12px;min-height:0;flex:1;}
.modal .mf{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line-soft);}
.xbtn{background:none;border:1px solid var(--line-soft);width:32px;height:32px;padding:0;font-size:18px;line-height:1;border-radius:2px;}

/* party screen */
.pscreen{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;height:100%;}
.plist{display:flex;flex-direction:column;gap:6px;min-width:0;}
.pmini.sel{border-color:var(--gold);background:rgba(201,164,92,.08);}
.pmini.benched{opacity:.6;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-bottom:12px;flex-wrap:wrap;}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:7px 14px;font-size:13px;color:var(--muted);border-radius:2px 2px 0 0;}
.tab.cur{color:var(--gold-hi);border-color:var(--line-soft);background:rgba(201,164,92,.06);}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:6px;vertical-align:1px;}
.sheet{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:18px;}
.sheet h3{font-size:14px;color:var(--gold);margin-bottom:6px;font-family:var(--f-sc);letter-spacing:.12em;font-weight:700;}
.abilrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.abil{border:1px solid var(--line-soft);text-align:center;padding:6px 2px;background:rgba(0,0,0,.25);}
.abil .k{font-family:var(--f-sc);font-size:11px;color:var(--gold);letter-spacing:.1em;}
.abil .s{font-family:var(--f-display);font-size:20px;}
.abil .m{font-size:12px;color:var(--muted);}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;}
.slot{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line-soft);background:rgba(0,0,0,.25);min-height:44px;}
.slot .k{font-family:var(--f-sc);font-size:11px;color:var(--gold);letter-spacing:.1em;width:56px;flex:0 0 auto;}
.slot .v{flex:1;min-width:0;font-size:13px;}
.slot .v small{display:block;color:var(--muted);font-size:11.5px;}
.inv{display:flex;flex-direction:column;gap:4px;}
.invrow{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line-soft);background:rgba(0,0,0,.2);}
.invrow .v{flex:1;min-width:0;font-size:13px;}
.invrow .v small{display:block;color:var(--muted);font-size:11.5px;}
.shopcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px;}
.kv dt{color:var(--muted);} .kv dd{margin:0;}
.loot{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.mythcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.sigil{width:44px;height:44px;}

/* map node label */
.nodelbl{position:absolute;transform:translate(-50%,0);font-family:var(--f-sc);letter-spacing:.08em;font-size:13px;color:var(--bone);text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;pointer-events:none;}
.nodelbl.locked{color:var(--dim);}
.nodelbl.done{color:var(--gold);}


/* ---------- location scene ---------- */
#scr-loc canvas{position:absolute;inset:0;width:100%;height:100%;}
#locmarks{position:absolute;left:0;top:0;bottom:0;right:360px;}
.mark{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--bone);font-family:var(--f-sc);letter-spacing:.08em;font-size:12.5px;text-shadow:0 1px 3px #000,0 0 10px #000;}
.mark .gem{width:38px;height:38px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 35%,#5a2a18,#1a0e0a);border:1.5px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.7);transition:transform .15s,box-shadow .15s;}
.mark .gem svg{transform:rotate(-45deg);width:20px;height:20px;stroke:var(--gold-hi);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.mark:hover .gem,.mark:focus-visible .gem{transform:rotate(45deg) scale(1.12);box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 22px rgba(255,140,60,.55);}
.mark.new .gem{animation:pulse 2.2s ease-in-out infinite;}
.mark.done .gem{background:radial-gradient(circle at 35% 35%,#3a2e1a,#15100a);border-color:#8a7040;}
.mark.done .gem svg{stroke:#a08a5a;}
.mark.locked .gem{background:#141010;border-color:#4a3a2a;}
.mark.locked .gem svg{stroke:#6a5a4a;}
.mark.locked{color:var(--dim);}
.mark.done{color:#c8b48a;}
.mark .lbl{white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 6px rgba(255,120,40,.3);}50%{box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 22px rgba(255,120,40,.8);}}
@media (prefers-reduced-motion: reduce){ .mark.new .gem{animation:none;} }
.locpanel{position:absolute;right:12px;top:12px;bottom:12px;width:336px;display:flex;flex-direction:column;}
.locpanel .lh{padding:16px 16px 8px;}
.locpanel .lh h2{font-size:22px;color:var(--gold-hi);}
.locpanel .ld{font-family:var(--f-body);font-size:15px;color:var(--muted);line-height:1.5;margin-top:6px;}
.locpanel .ll{flex:1;min-height:0;padding:6px 12px;display:flex;flex-direction:column;gap:4px;}
.poirow{display:flex;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line-soft);background:rgba(0,0,0,.28);text-align:left;font-family:var(--f-ui);letter-spacing:0;color:var(--bone);border-radius:2px;}
.poirow:hover:not(:disabled){border-color:var(--line);}
.poirow svg{width:18px;height:18px;flex:0 0 auto;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.poirow .t{flex:1;min-width:0;font-size:14px;}
.poirow .t small{display:block;color:var(--muted);font-size:11.5px;}
.poirow.done{opacity:.6;}
.poirow:disabled{opacity:.45;}
.locpanel .lf{padding:10px 12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line-soft);}
.locpanel .lf .btn{font-size:11.5px;padding:.55em .3em;}
.disc{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:6px;max-width:min(460px,calc(100% - 400px));pointer-events:none;}
.disc div{padding:8px 12px;font-size:13.5px;animation:fadein .4s;}
@keyframes fadein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;}}
/* dialogue */
.dlg .speaker{font-family:var(--f-sc);letter-spacing:.14em;color:var(--gold);font-size:12.5px;margin-bottom:6px;}
.dlg .roll{font-size:12.5px;padding:6px 10px;border-left:2px solid var(--gold);background:rgba(201,164,92,.07);margin-bottom:10px;}
.dlg .roll.bad{border-color:var(--bad);background:rgba(226,90,74,.07);}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.opt{text-align:left;padding:9px 12px;border:1px solid var(--line-soft);background:rgba(0,0,0,.3);font-family:var(--f-body);font-size:16px;letter-spacing:0;color:var(--bone);border-radius:2px;}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(201,164,92,.08);}
.opt:disabled{opacity:.45;}
.opt .ck{font-family:var(--f-sc);font-size:12.5px;color:var(--gold);letter-spacing:.06em;}
.opt .odds{float:right;font-family:var(--f-ui);font-size:12px;color:var(--muted);}
/* map extras */
.mapinfo{position:absolute;right:16px;top:80px;width:280px;padding:12px 14px;font-size:13px;}
.supply{display:inline-flex;align-items:center;gap:4px;}
.devbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;gap:4px;padding:6px;z-index:15;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);}
.devbar .btn{font-size:11px;padding:.35em .6em;}
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.moncount{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line-soft);background:rgba(0,0,0,.25);font-size:13px;}
.moncount .n{flex:1;min-width:0;}
.moncount b{width:18px;text-align:center;}
.jq{padding:10px 12px;border:1px solid var(--line-soft);background:rgba(0,0,0,.25);margin-bottom:6px;}
.jq h4{margin:0 0 4px;font-family:var(--f-display);font-size:15px;color:var(--gold-hi);font-weight:600;}
.jq.main h4::before{content:"◆ ";color:var(--ember);}
.jq.done{opacity:.6;}

@media (max-width: 900px){
  #locmarks{right:0;bottom:46%;}
  .locpanel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%;}
  .disc{max-width:calc(100% - 32px);top:60px;}
  .mapinfo{display:none;}
  #scr-create{grid-template-columns:minmax(0,1fr);overflow:auto;padding:12px;}
  .steps{flex-direction:row;overflow-x:auto;padding:8px;}
  .steps .step{flex:0 0 auto;}
  .create-side{order:3;}
  .logp{display:none;}
  .logp.open{display:flex;left:12px;right:12px;width:auto;z-index:20;}
  .hud{flex-wrap:wrap;justify-content:center;bottom:6px;padding:8px;gap:6px;}
  .ab{width:44px;height:44px;font-size:8.5px;}
  .ab svg{width:18px;height:18px;}
  .ucard img{width:44px;height:55px;}
  .ucard .info{min-width:120px;}
  .pscreen{grid-template-columns:minmax(0,1fr);}
  .plist{flex-direction:row;overflow-x:auto;}
  .plist .pmini{min-width:150px;}
  .sheet{grid-template-columns:minmax(0,1fr);}
  .shopcols{grid-template-columns:minmax(0,1fr);}
  .map-bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));}
  .map-bottom .btn{font-size:11px;padding:.55em .3em;}
  .party-col{top:auto;bottom:112px;left:8px;right:8px;flex-direction:row;overflow-x:auto;}
  .gold-box{flex-direction:column;gap:2px;padding:6px 10px;}
  .party-col .pmini{min-width:150px;}
  .pmini .bar{width:80px;}
  .abil-table{grid-template-columns:minmax(90px,1fr) auto 40px auto 44px 44px;gap:6px;}
  .init-bar{top:6px;left:8px;right:8px;transform:none;max-width:none;}
  .round-lbl{top:72px;left:8px;padding:4px 10px;}
  .bmenu{top:72px;right:8px;}
  .hud{left:8px;right:8px;transform:none;max-width:none;}
  .hud .ucard img{display:none;}
  .hud .ucard{flex:1 1 100%;}
  .hud .ucard .info{flex:1;}
  .hud .abar{flex:1;justify-content:center;}
  .endturn{min-width:72px;font-size:12px;}
  .pop{bottom:auto;top:110px;}
  .tip{max-width:260px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
.ooclist{display:flex;flex-direction:column;gap:6px}

.oocrow .v{min-width:0;flex:1}.oocrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

// ------------------------------------------------------------
//  Item construction and description
// ------------------------------------------------------------
let _itemSeq = 1;
function mkItem(kind, base, ench=0, props=[], extra={}){ return Object.assign({id:'i'+(Date.now()%1000000).toString(36)+'_'+(_itemSeq++)+Math.floor(Math.random()*1e4).toString(36), kind, base, ench, props:(props||[]).slice()}, extra); }
function mkUnique(uid){ const U=UNIQUES[uid]; return mkItem(U.kind, U.base, U.ench||0, U.props||[], {unique:uid}); }
// spec strings: 'w:longsword+1:flaming,keen', 'w:longsword~mw', 'a:chainshirt+1', 'sh:heavyShield', 'r:ringProt+1' (wondrous),
// 'p:clw*3', 'sc:fireball', 'j:ashSigil*2', 'q:vaultKey', 'u:gatewardenBlade'
function specToItem(spec){
  if(Array.isArray(spec)){ const [k,b,e,pr,ex]=spec; return mkItem(k,b,e||0,pr||[],ex||{}); }
  let [pfx, rest] = spec.split(/:(.*)/s);
  let qty = 1; if(rest.includes('*')){ const [a,q]=rest.split('*'); rest=a; qty=+q; }
  let mw=false; if(rest.includes('~mw')){ mw=true; rest=rest.replace('~mw',''); }
  let props=[]; const m = rest.split(':'); rest=m[0]; if(m[1]) props=m[1].split(',');
  let ench=0; if(rest.includes('+')){ const [a,e]=rest.split('+'); rest=a; ench=+e; }
  const kinds={w:'weapon',a:'armor',sh:'shield',r:'wondrous',p:'potion',sc:'scroll',j:'junk',q:'quest'};
  if(pfx==='u') return mkUnique(rest);
  const it = mkItem(kinds[pfx], rest, ench, props, mw?{mw:true}:{});
  if(['potion','scroll','junk'].includes(it.kind)) it.qty=qty;
  return it;
}
function itemData(it){ return it && it.unique? UNIQUES[it.unique] : null; }
function itemSlotOf(it){ if(it.kind==='wondrous'){ const U=itemData(it); return U? U.slot : WONDROUS[it.base].slot; } return null; }
function itemName(it){
  if(!it) return '—';
  const U = itemData(it); if(U) return U.name;
  if(it.kind==='weapon'){ const b=WEAPONS[it.base]; let n=b.name; const pr=(it.props||[]).filter(p=>p!=='coldIron').map(p=>WEAPON_PROPS[p].name); if((it.props||[]).includes('coldIron')) n='Cold Iron '+n; if(pr.length) n=pr.join(' ')+' '+n; return (it.ench?'+'+it.ench+' ':'')+n + (it.mw&&!it.ench?' (masterwork)':''); }
  if(it.kind==='armor'){ return (it.ench?'+'+it.ench+' ':'')+ARMORS[it.base].name+(it.mw&&!it.ench?' (masterwork)':''); }
  if(it.kind==='shield'){ return (it.ench?'+'+it.ench+' ':'')+SHIELDS[it.base].name; }
  if(it.kind==='wondrous'){ const w=WONDROUS[it.base]; return w.name+' +'+it.ench; }
  if(it.kind==='potion') return POTIONS[it.base].name;
  if(it.kind==='scroll') return 'Scroll of '+SPELLS[it.base].name;
  if(it.kind==='junk') return JUNK[it.base].name;
  if(it.kind==='quest') return QUEST_ITEMS[it.base].name;
  return '?';
}
function itemPrice(it){
  const U=itemData(it); if(U) return U.price;
  if(it.kind==='weapon'){ const b=WEAPONS[it.base]; let e=(it.ench||0)+(it.props||[]).reduce((s,p)=>s+(WEAPON_PROPS[p].cost||0),0); let p=b.price + (it.ench?300:0) + (it.mw&&!it.ench?300:0) + e*e*2000; if((it.props||[]).includes('coldIron')) p+=b.price+(it.ench?2000:0); return p; }
  if(it.kind==='armor'){ const e=it.ench||0; return ARMORS[it.base].price + (e||it.mw?150:0) + e*e*1000; }
  if(it.kind==='shield'){ const e=it.ench||0; return SHIELDS[it.base].price + (e?150:0) + e*e*1000; }
  if(it.kind==='wondrous'){ const w=WONDROUS[it.base]; return w.costTable? w.costTable[it.ench] : it.ench*it.ench*w.costMul; }
  if(it.kind==='potion') return POTIONS[it.base].price;
  if(it.kind==='scroll'){ const S=SPELLS[it.base]; const lv=Math.max(1,...Object.values(S.lv)); return [0,25,150,375,700,1125,1650][lv]; }
  if(it.kind==='junk') return JUNK[it.base].value*2;
  if(it.kind==='quest') return 0;
  return 0;
}
function bonusText(b){
  if(!b) return [];
  const out=[];
  const names={atk:'attack',dmg:'damage',ac:'AC',saves:'all saves',fort:'Fortitude',ref:'Reflex',will:'Will',init:'initiative',hp:'hit points',spellDC:'spell DCs',cl:'caster level',spellPen:'vs spell resistance',miss:'% miss chance against you',regen:'hp regained each round',mp:'mythic power',speed:'ft speed'};
  for(const [k,v] of Object.entries(b)){
    if(names[k]) out.push(k==='miss'? `${v}${names[k]}` : k==='regen'? `${v} ${names[k]}` : k==='speed'? `+${v}${names[k]}` : `${fmtMod(v)} ${names[k]}`);
    else if(k==='abil') for(const [a,n] of Object.entries(v)) out.push(`+${n} ${ABIL_NAMES[a]}`);
    else if(k==='resist') for(const [a,n] of Object.entries(v)) out.push(`resist ${a} ${n}`);
    else if(k==='dr') out.push(`DR ${v.v}/${v.by.length?v.by.join(' or '):'—'}`);
    else if(k==='skills') for(const [a,n] of Object.entries(v)) out.push(`${fmtMod(n)} ${SKILLS[a].name}`);
    else if(k==='immune') out.push('immune to '+v.map(c=>c==='energyDrain'?'negative levels':(CONDITIONS[c]?CONDITIONS[c].name.toLowerCase():c)).join(', '));
    else if(k==='vs') for(const [t,x] of Object.entries(v)) out.push(`${x.atk?fmtMod(x.atk)+' attack ':''}${x.dmg?fmtMod(x.dmg)+' damage ':''}vs ${t==='evil'?'evil creatures':t+'s'}`);
  }
  return out;
}
function itemDesc(it){
  if(!it) return '';
  const U=itemData(it);
  let base='';
  if(it.kind==='weapon'){ const b=WEAPONS[it.base]; base=`${b.dmg[0]}d${b.dmg[1]} ${b.crit<20?b.crit+'–20':'20'}/×${b.mult} · ${b.hands===2?'two-handed':(b.light?'light':'one-handed')}${b.range?' · range '+b.range+' ft':''}${b.reach?' · reach':''}${b.finesse?' · finesse':''}`; (it.props||[]).forEach(p=>{ const P=WEAPON_PROPS[p]; if(p==='coldIron') base+=' · overcomes DR/cold iron'; else if(P.extra) base+=` · +${P.extra.dice[0]}d${P.extra.dice[1]} ${P.extra.type}${P.extra.vsEvil?' vs evil':''}`; else if(p==='keen') base+=' · doubled threat range'; else if(P.bane) base+=` · +2 attack, +2d6 damage vs ${P.bane}s`; }); }
  else if(it.kind==='armor'){ const a=ARMORS[it.base]; base=`AC +${a.ac+(it.ench||0)} · max Dex +${a.maxDex} · penalty ${a.acp+(it.mw||it.ench?1:0)} · spell failure ${a.asf}% · ${a.cat}`; }
  else if(it.kind==='shield'){ const a=SHIELDS[it.base]; base=`Shield AC +${a.ac+(it.ench||0)} · penalty ${a.acp}`; }
  else if(it.kind==='wondrous'){ if(it.base){ const w=WONDROUS[it.base]; const m={acDeflect:'deflection bonus to AC',acNatural:'enhancement to natural armor',saves:'resistance bonus on all saves'}; base=`+${it.ench} ${m[w.stat]||('enhancement bonus to '+ABIL_NAMES[w.stat])}`; } else base=(U?({ring:'Ring',neck:'Neck',cloak:'Shoulders',belt:'Belt',head:'Head'})[U.slot]:''); }
  else if(it.kind==='potion'){ const p=POTIONS[it.base]; base= p.heal?`Heals ${p.heal[0]}d${p.heal[1]}+${p.heal[2]}. Drinking is a standard action.`:(p.buff==='heroism'?'+2 on attacks and saves for the battle.':'+3 natural armor for the battle.'); }
  else if(it.kind==='scroll'){ const S=SPELLS[it.base]; base=`Single use. ${S.desc} Usable by casters who have this spell on their list.`; }
  else if(it.kind==='junk') return JUNK[it.base].desc;
  else if(it.kind==='quest') return QUEST_ITEMS[it.base].desc;
  if(U){ const bt=bonusText(U.bonus); if(bt.length) base+=' · '+bt.join(', '); if(U.grants) base+=' · '+U.grants.map(g=>`${SPELLS[g.spell].name} ${g.uses}/rest`).join(', '); }
  return base;
}
function itemFlavor(it){ const U=itemData(it); return U? U.desc : (it.kind==='junk'? JUNK[it.base].desc : ''); }
function isEquippable(it){ return ['weapon','armor','shield','wondrous'].includes(it.kind); }

          check:{skill:'athletics', dc:12, ok:{text:'You heave the slab aside. The guardsman\'s pack holds coin and a healing draught.', fx:[{gold:40},{item:'p:clw'},{xp:50}]}, fail:{text:'The slab shifts and bites into your fingers. It will not move yet.', fx:[{damage:[1,4]}], retry:true}}},
        {id:'crowd', type:'lore', name:'The Fallen Crowd', x:.78, y:.30,
          text:'Festival-goers lie where they fell, masks still on. One small hand grips a paper sun. Whatever brought the square down wanted a crowd.', fx:[{xp:25}]},
      ]},
    {id:'tun', name:'Undercity Tunnels', kind:'site', biome:'cave', x:.24, y:.58, links:['sq','vault','cist','smug'],
      desc:'Brick tunnels older than the city above, full of rats, runoff and things that eat the dead.',
      pois:[
        {id:'tamsin', type:'battle', name:'Running Footsteps', x:.30, y:.55,
          text:'A halfling bursts out of a side passage, a satchel clutched to her chest, ghouls at her heels.',
          talk:{start:'a', nodes:{a:{speaker:'Tamsin Quill', text:'"Oh good, heroes. Hold these for me?" She ducks behind you and draws a knife. "I\'m Tamsin. I know every drain under Merovar. Help me with these and I\'ll get you out."', opts:[{t:'"Get behind me." Fight.', battle:true, fx:[{recruit:'tamsin'}]}]}}},
          battle:{enemies:[['ghoul',1],['zombie',2],['cultist',1]], map:M('cave','cave',15,13,23)}},
        {id:'marks', type:'lore', name:'Chalk Marks', x:.70, y:.25, hidden:{dc:13},
          text:'Tiny chalk marks run along the brick at knee height: an arrow, a coin, a crossed-out skull. Smugglers\' signs, pointing down a side passage.', fx:[{reveal:'smug'},{quest:['q_smuggler',1]},{xp:50}]},
        {id:'graves', type:'check', name:'Warden Graves', x:.55, y:.78,
          text:'A row of niches holds the bones of old wardens, each with a bronze plaque. One niche is empty except for a small iron box.',
          check:{skill:'religion', dc:12, ok:{text:'You speak the wardens\' rite of passage and open the box respectfully. Inside is a heavy bronze key marked with the wardstone rune.', fx:[{item:'q:vaultKey'},{xp:100}]}, fail:{text:'The box is sealed with a ward you do not recognize. Perhaps someone who knows the old rites could open it.', retry:true}}},
        {id:'grate', type:'chest', name:'Rusted Grate', x:.12, y:.30, hidden:{dc:14},
          text:'Something glints beneath a rusted drain grate.', chest:{lock:13, trap:{dc:14, disarm:13, dmg:[2,6], type:'piercing', save:['ref',13], name:'spiked grate'}, gold:80, items:['sc:magicMissile','p:clw']}},
        {id:'vaultdoor', type:'check', name:'The Vault Door', x:.86, y:.55,
          text:'A round bronze door is set into the tunnel wall, carved with the wardstone rune. Warmth leaks from its seams, and you feel it in your chest like a second heartbeat.',
          talk:{start:'a', nodes:{a:{text:'The door is locked. It has no handle, only a keyhole shaped like the ward rune.', opts:[
            {t:'Use the Warden\'s Vault Key.', req:{item:'vaultKey'}, fx:[{flag:'vault_open'},{removeItem:'vaultKey'},{quest:['q_ash',2]},{done:true}], go:'open'},
            {t:'[Thievery 16] Pick the lock.', check:['thievery',16], ok:'open', okfx:[{flag:'vault_open'},{quest:['q_ash',2]},{done:true}], fail:'nope'},
            {t:'"Tamsin?"', req:{companion:'tamsin'}, go:'tam'},
            {t:'Leave it for now.', end:true}]},
            tam:{speaker:'Tamsin Quill', text:'"A ward-lock. Pretty. Stand back." A minute later the door sighs open. "Don\'t tell the wardens."', fx:[{flag:'vault_open'},{quest:['q_ash',2]},{done:true}], opts:[{t:'Continue.', end:true}]},
            open:{text:'The door rolls aside on silent hinges. Warm red light spills into the tunnel.', opts:[{t:'Continue.', end:true}]},
            nope:{text:'The mechanism resists you. A key, or a more practiced hand, might do better.', opts:[{t:'Leave it.', end:true}]}}}},
      ]},
    {id:'vault', name:"The Warden's Vault", kind:'site', biome:'cave', x:.36, y:.80, links:['tun'], req:{flag:'vault_open'}, reqText:'The vault door in the tunnels is sealed.',
      desc:'A vault sealed since the wardstones were raised. The air is warm and hums like a held note.',
      pois:[
        {id:'husks', type:'battle', name:'The Guardians', x:.35, y:.60,
          text:'Two armored skeletons stand at the inner door, blue flame in their chests. They raise their blades as you approach.',
          talk:{start:'a', nodes:{a:{text:'The husks do not attack yet. Their blades hover, waiting.', opts:[
            {t:'[Religion 14] Speak the wardens\' oath.', check:['religion',14], ok:'pass', fail:'fight'},
            {t:'Draw steel.', battle:true}]},
            pass:{text:'At the last line of the oath the husks lower their blades, step aside and go still. Whatever they guarded, they judge you worthy of it.', fx:[{xp:300},{done:true}], opts:[{t:'Pass.', end:true}]},
            fight:{text:'Your words falter. The husks advance.', opts:[{t:'Fight.', battle:true}]}}},
          battle:{enemies:[['wardenHusk',2]], map:M('cave','cave',13,12,31)}},
        {id:'murals', type:'check', name:'Murals of the First Crusade', x:.72, y:.30,
          text:'Faded murals show knights marching north beneath a golden banner. In the last panel, a knight draws a sword from the banner\'s pole.',
          check:{skill:'world', dc:13, ok:{text:'You recognize the banner: the Standard of Dawn, lost when Aldoret fell. The murals insist it was more than a flag. There is a blade inside it.', fx:[{flag:'lore_standard'},{xp:100}]}, fail:{text:'The paint is too faded to follow the story.', retry:true}}},
        {id:'heart', type:'story', name:'The Emberheart', x:.55, y:.25, req:{poi:'husks'}, reqText:'The guardians bar the way.',
          text:'In the vault\'s heart a shard of red-gold crystal hangs in the air, pulsing like a heart. When you reach for it, it reaches back. Heat floods your veins; for a moment you see the Sundering from above, a wound in the world, and something vast and crowned staring up at you from within. The shard is gone. Its light is in you now.',
          fx:[{mythicSpark:true},{xp:600},{flag:'ember'},{quest:['q_ash',3]}]},
        {id:'reliq', type:'chest', name:'Warden\'s Reliquary', x:.18, y:.28, hidden:{dc:15},
          text:'Behind a loose panel in the murals is a narrow reliquary.', chest:{lock:15, gold:120, items:['u:wardenSignet']}},
      ]},
    {id:'smug', name:"Smugglers' Cache", kind:'site', biome:'cave', x:.10, y:.40, links:['tun'], hidden:true,
      desc:'A dry chamber stacked with crates, reached through a crawlway only a halfling would call a door.',
      pois:[
        {id:'crates', type:'chest', name:'Stacked Crates', x:.50, y:.50, text:'Crates of contraband: spirits, silk, and one box that is much heavier than the rest.', chest:{lock:13, gold:100, items:['u:smugglerStiletto','p:clw*2'], fx:[{quest:['q_smuggler','done']}]}},
        {id:'ledger', type:'lore', name:'Smuggler\'s Ledger', x:.25, y:.35, text:'A ledger records deliveries to "the Grey Brothers" at the Dawnward temple: lamp oil, chains, and a dozen crates marked only with a cracked flame. The cult has been planning this for months.', fx:[{xp:75}]},
      ]},
    {id:'cist', name:'Cistern Stair', kind:'site', biome:'cave', x:.40, y:.46, links:['tun','strt'],
      desc:'A spiral stair climbs out of the old cistern toward the streets. Webs choke the upper landing.',
      pois:[
        {id:'webs', type:'battle', name:'Web-Choked Landing', x:.55, y:.40, text:'The webs quiver. Two spiders the size of ponies drop from the dark, their bellies glowing like coals.',
          battle:{enemies:[['riftSpider',2]], map:M('cave','cave',13,11,37)}},
        {id:'cocoon', type:'chest', name:'Silk Cocoon', x:.30, y:.70, text:'A man-sized cocoon hangs from the rail. Whoever was inside is past helping, but his belongings are not.', req:{poi:'webs'}, chest:{gold:45, items:['a:chainshirt','p:clw']}},
      ]},
    {id:'strt', name:'The Burning Streets', kind:'site', biome:'city', x:.52, y:.40, links:['cist','mill','tanner','temple'],
      desc:'Merovar burns. Cultists in ash-grey robes hunt survivors through the smoke.',
      pois:[
        {id:'ysolde', type:'battle', name:'The Scholar\'s Doorway', x:.50, y:.50,
          text:'An elven scholar holds a doorway alone, flame in her hands, while cultists and a fire-breathing hound close in.',
          talk:{start:'a', nodes:{a:{speaker:'Ysolde Marrow', text:'"You are not cultists. Excellent. I have forty years of research behind this door and I am not leaving it to be burned by amateurs." Fire curls around her fingers. "Fire, mostly. I am told I am very good at fire."', opts:[{t:'Fight beside her.', battle:true, fx:[{recruit:'ysolde'}]}]}}},
          battle:{enemies:[['cultist',3],['riftHound',1],['cultZealot',1]], map:M('city','street',16,13,37)}},
        {id:'smith', type:'chest', name:'Looted Smithy', x:.20, y:.35, text:'The cult already looted the smithy, but they missed the back room.', chest:{gold:50, items:['w:longsword~mw','sh:heavyShield']}},
        {id:'bakery', type:'chest', name:'Collapsed Bakery', x:.80, y:.70, text:'The baker\'s strongbox is visible under a smoldering beam.', chest:{trap:{dc:13, disarm:12, dmg:[2,6], type:'fire', save:['ref',13], name:'burning beam'}, gold:90, items:['p:clw*2','sc:burningHands']}},
        {id:'cellar', type:'npc', name:'Voices in a Cellar', x:.72, y:.22, hidden:{dc:15},
          text:'Beneath a trapdoor you hear whispering. A dozen survivors are hiding in a wine cellar.',
          talk:{start:'a', nodes:{a:{speaker:'An old woman', text:'"Please. The children won\'t last another night down here. Is it safe to go up?"', opts:[
            {t:'"Head for the Old Mill. The streets east are clear." Guide them.', fx:[{flag:'cellar_saved'},{quest:['q_cellar','done']},{xp:150},{done:true}], go:'b'},
            {t:'Give them a healing potion as well.', req:{item:'clw'}, fx:[{removeItem:'clw'},{flag:'cellar_saved'},{flag:'cellar_potion'},{quest:['q_cellar','done']},{xp:200},{done:true}], go:'b'},
            {t:'"Stay hidden a little longer."', fx:[{quest:['q_cellar',1]}], end:true}]},
            b:{text:'They climb out into the smoke and hurry east, the children silent and wide-eyed.', opts:[{t:'Continue.', end:true}]}}}},
      ]},
    {id:'mill', name:'Refuge at the Old Mill', kind:'town', biome:'city', x:.62, y:.66, links:['strt','tanner','temple','pyre'], rest:'free',
      desc:'Survivors have barricaded the old river mill. Crusade soldiers, refugees and a few merchants who refused to leave their stock.',
      pois:[
        {id:'dask', type:'npc', name:'Captain Irelle Dask', x:.50, y:.35,
          talk:{start:'a', nodes:{
            a:{speaker:'Captain Irelle Dask', text:'A tall woman in scorched crusade blue looks you up and down. "You came up from the undercity? Then you\'ve seen more of this than I have. The cult holds the Dawnward temple. If they finish whatever they\'re doing there, the last wardstone falls, and Merovar with it."', fx:[{quest:['q_ash',4]},{flag:'met_dask'}], opts:[
              {t:'"Who leads them?"', go:'b'},{t:'"We\'ll take the temple."', go:'c'},{t:'[World 12] "How long do we have?"', check:['world',12], ok:'d', fail:'c'}]},
            b:{speaker:'Captain Irelle Dask', text:'"A man called Corvin Hale. He was a priest here once. Now they call him the Ash Prophet. He\'ll be at the wardstone when the time comes. Take the temple first, or he\'ll have every cultist in the city at his back."', opts:[{t:'"We\'ll take the temple."', go:'c'}]},
            c:{speaker:'Captain Irelle Dask', text:'"Good. Rest here if you need to. The merchants will trade with anyone who\'s still breathing." She hesitates. "And if you pass through Tanner\'s Row, old Petr\'s girl went missing there."', opts:[{t:'Leave.', end:true}]},
            d:{speaker:'Captain Irelle Dask', text:'"The wardstone\'s song is weakening. I\'d guess two days." She lowers her voice. "The temple has a hidden reliquary behind the altar. If the cult hasn\'t found it, there may be something there worth having."', fx:[{flag:'hint_reliq'},{xp:50}], opts:[{t:'"We\'ll take the temple."', go:'c'}]}}}},
        {id:'petr', type:'npc', name:'Petr the Chandler', x:.25, y:.55,
          talk:{start:'a', nodes:{
            a:{speaker:'Petr the Chandler', text:'An old man sits among crates of candles, turning a wax figure over and over in his hands. "My Mira went to deliver candles in Tanner\'s Row before the sky opened. She hasn\'t come back."', fx:[{quest:['q_mira',1]}], opts:[
              {t:'"We\'ll find her."', end:true},
              {t:'"Mira is safe. She\'s on her way here."', req:{flag:'mira_found'}, go:'b'}]},
            b:{speaker:'Petr the Chandler', text:'He weeps openly, then presses something into your hands: a belt of braided wax-cord. "My wife made this. It kept me alive through the last war. Let it keep you."', fx:[{item:'u:chandlerLantern'},{gold:100},{xp:250},{quest:['q_mira','done']},{done:true}], opts:[{t:'Continue.', end:true}]}}}},
        {id:'grateful', type:'npc', name:'Cellar Survivors', x:.78, y:.60, req:{flag:'cellar_saved'}, hideLocked:true,
          talk:{start:'a', nodes:{a:{speaker:'The old woman', text:'"You got us out. We haven\'t much, but take this."', fx:[{item:'p:cmw*2'},{gold:50},{done:true}], opts:[{t:'Thank her.', end:true}]}}}},
        {id:'hesper', type:'merchant', name:'Hesper Vane, Smith', x:.20, y:.28, merchant:{id:'hesper', types:['smith','armorer']}},
        {id:'tolan', type:'merchant', name:'Brother Tolan, Alchemist', x:.80, y:.28, merchant:{id:'tolan', types:['alchemist','arcanist'], supplies:true}},
        {id:'inn', type:'inn', name:'The Mill Loft', x:.58, y:.72, text:'Straw pallets in the grain loft. It is dry, and nobody is on fire.'},
        {id:'board', type:'board', name:'Sellswords', x:.40, y:.82},
      ]},
    {id:'tanner', name:"Tanner's Row", kind:'site', biome:'city', x:.72, y:.50, links:['strt','mill'],
      desc:'The tanneries reek even through the smoke. Something has been dragging bodies into the vats.',
      pois:[
        {id:'den', type:'battle', name:'The Vat House', x:.55, y:.45, text:'Ghouls crouch among the tanning vats, and a cultist feeds them from a cart of the dead. In a hanging cage above, a girl is holding her breath.',
          battle:{enemies:[['ghoul',3],['cultist',2]], map:M('city','ruins',15,12,43), fx:[{flag:'mira_found'},{quest:['q_mira',2]},{xp:100}]}},
        {id:'box', type:'chest', name:"Dyer's Strongbox", x:.22, y:.70, hidden:{dc:14}, text:'The master dyer hid his strongbox beneath a vat of indigo.', chest:{lock:14, gold:150, items:['p:cmw','j:oldJewelry']}},
      ]},
    {id:'temple', name:'The Ashen Temple', kind:'site', biome:'temple', x:.80, y:.38, links:['strt','mill','gate','pyre'],
      desc:'The Dawnward temple, fouled with ash. The cult\'s chanting shakes dust from the rafters.',
      pois:[
        {id:'nave', type:'battle', name:'The Fouled Nave', x:.50, y:.50,
          text:'Cult priests chant over the wounded while zealots guard the aisle. Young archers in grey watch from the gallery, their hands shaking.',
          talk:{start:'a', nodes:{a:{text:'The chanting falters as you enter.', opts:[
            {t:'[Persuasion 16] "Your prophet is lying to you. Run while you can."', check:['persuasion',16], ok:'b', fail:'c'},
            {t:'Attack.', battle:true}]},
            b:{text:'The archers in the gallery look at each other, drop their bows and bolt for the side door. The zealots scream after them.', fx:[{flag:'temple_scared'},{xp:150}], opts:[{t:'Attack the rest.', battle:true}]},
            c:{text:'A zealot laughs. "The ember-thief wants to talk. Kill them."', opts:[{t:'Fight.', battle:true}]}}},
          battle:{enemies:[['cultZealot',2],['cultPriest',1],['cultArcher',2],['dretch',1]], map:M('temple','temple',15,14,41), mods:[{flag:'temple_scared', remove:[['cultArcher',2]]}], fx:[{flag:'temple_cleared'},{quest:['q_ash',5]}]}},
        {id:'altar', type:'check', name:'The Desecrated Altar', x:.50, y:.18, req:{poi:'nave'}, reqText:'The cult still holds the nave.',
          text:'The altar of the Dawnward is smeared with ash and blood. The sunburst above it has been turned upside down.',
          check:{skill:'religion', dc:15, ok:{text:'You right the sunburst and speak the dawn prayer. The ash burns away in a flash of clean light, and a medallion rises from the altar stone.', fx:[{item:'u:dawnwardRelic'},{xp:200},{done:true}]}, fail:{text:'The corrupted altar lashes out with a flare of black fire.', fx:[{damage:[1,6]}], retry:true}}},
        {id:'cells', type:'npc', name:'Prisoners in the Undercroft', x:.20, y:.70, req:{poi:'nave'}, reqText:'The cult still holds the nave.',
          talk:{start:'a', nodes:{a:{speaker:'A bruised guardsman', text:'"They were taking us one at a time. To the gate, they said. The Ashward Gate. They\'ve got a nest of demons down there, feeding them."', fx:[{reveal:'gate'},{xp:100}], opts:[
            {t:'[Persuasion 12] "Tell me everything you saw."', check:['persuasion',12], ok:'b', fail:'c'},{t:'"Go. Get to the Old Mill."', go:'c'}]},
            b:{speaker:'A bruised guardsman', text:'"The prophet keeps his own guards close. Two zealots, a caster, and those pale demons. If you can shake the zealots\' faith, they\'ll break. They\'re scared of him, not loyal."', fx:[{flag:'intel_corvin'},{xp:50},{done:true}], opts:[{t:'"Go to the mill."', end:true}]},
            c:{text:'The prisoners limp out toward the mill.', fx:[{done:true}], opts:[{t:'Continue.', end:true}]}}}},
        {id:'reliq', type:'chest', name:'Hidden Reliquary', x:.80, y:.22, hidden:{dc:18, hint:'hint_reliq', hintDc:12}, req:{poi:'nave'},
          text:'Behind the altar, a panel slides aside on a hidden catch.', chest:{gold:80, items:['u:lastLightCenser']}},
      ]},
    {id:'gate', name:'The Ashward Gate', kind:'site', biome:'city', x:.90, y:.60, links:['temple'], hidden:true,
      desc:'An old sally gate in Merovar\'s inner wall, now a nest. The smell reaches you a street away.',
      pois:[
        {id:'nest', type:'battle', name:'The Nest', x:.55, y:.45, text:'Pale dretches squat in a filthy nest of bones, tended by a hulking cultist branded with glowing ash.',
          battle:{enemies:[['dretch',3],['cultBrute',1]], map:M('city','plaza',14,12,53)}},
        {id:'gatehouse', type:'chest', name:'The Gatehouse', x:.82, y:.30, req:{poi:'nest'}, text:'The last gatewarden\'s quarters are untouched. His sword hangs above a locked chest.', chest:{lock:16, gold:120, items:['u:gatewardenBlade']}},
      ]},
    {id:'pyre', name:'The Last Wardstone', kind:'boss', biome:'city', x:.92, y:.18, links:['temple','mill'], req:{flag:'temple_cleared'}, reqText:'The cult still holds the temple. Retake it first.',
      desc:'The last wardstone of Merovar, its song faltering. The Ash Prophet waits beneath it.',
      pois:[
        {id:'prophet', type:'battle', name:"The Prophet's Pyre", x:.50, y:.45, boss:true,
          text:'At the foot of the wardstone, Corvin Hale is preparing to shatter it. "You feel it too," he says, looking at your hands. "The ember. It will burn you hollow, as it burned the rest of us."',
          talk:{start:'a', nodes:{a:{speaker:'Corvin Hale', text:'"Join us, ember-bearer. Or burn."', opts:[
            {t:'[Persuasion 15] Call out to his zealots: "He\'s using you."', check:['persuasion',15], ok:'b', fail:'c', req:{flag:'intel_corvin'}, reqText:'(needs information about his guards)'},
            {t:'[Religion 16] "The ember isn\'t yours to feed. Your god has left you."', check:['religion',16], ok:'d', fail:'c'},
            {t:'"Burn, then." Attack.', battle:true}]},
            b:{text:'One of the zealots lowers his sword and walks away into the smoke. Corvin screams after him.', fx:[{flag:'corvin_zealot'},{xp:150}], opts:[{t:'Attack.', battle:true}]},
            d:{text:'Corvin flinches. For a heartbeat the fire in his eyes gutters, and the demons at his side hesitate, sensing his doubt. One of them slinks back into the dark.', fx:[{flag:'corvin_doubt'},{xp:150}], opts:[{t:'Attack.', battle:true}]},
            c:{speaker:'Corvin Hale', text:'"Words. Only words. Kill them."', opts:[{t:'Fight.', battle:true}]}}},
          battle:{enemies:[['corvin',1],['cultZealot',2],['cultInvoker',1],['dretch',2]], map:M('city','plaza',17,14,59), mods:[{flag:'corvin_zealot', remove:[['cultZealot',1]]},{flag:'corvin_doubt', remove:[['dretch',1]]}],
            fx:[{quest:['q_ash','done']},{mythicTier:1},{endAct:true}]}},
      ]},
  ],
};

// ============================================================
//  ACT II — THE BLASTED MARCH
// ============================================================
const ACT2 = {
  id:'a2', num:'II', title:'The Crusade Marches', palette:'waste', start:'kf', level:[4,7],
  intro:'Named Marshal of the Crusade, you ride north with a ragged army into the blasted lands. Your goal is Aldoret, the fortress that fell twenty years ago, and the relic within it: the Standard of Dawn, the banner that once turned demons back at the river.',
  outro:'The Standard of Dawn flies over Aldoret for the first time in twenty years. Across the blasted lands, demons look up at it and remember being afraid. Somewhere beyond the rift, the Hollow Crown turns its gaze toward your fortress.',
  encounters:[ [['riftHound',2],['cultZealot',1]], [['gargoyle',1],['riftHound',1]], [['brimorak',1],['dretch',3]], [['deserter',2],['deserterArcher',1]], [['wight',1],['skeletalChampion',2]] ],
  locations:[
    {id:'kf', name:'Kettle Ford Camp', kind:'town', biome:'waste', x:.10, y:.66, links:['road','hollow'], rest:'free',
      desc:'The crusade\'s staging camp on the Kettle River: tents, forges, a field hospital and three thousand nervous soldiers.',
      pois:[
        {id:'holt', type:'npc', name:'Quartermaster-General Holt', x:.48, y:.30,
          talk:{start:'a', nodes:{
            a:{speaker:'Sir Maren Holt', text:'A heavy knight with a ledger under one arm salutes you. "Marshal. The army is yours. Aldoret is four days north. The Broken Road is the only road, and something has been killing our scouts on it."', fx:[{quest:['q_aldoret',1]}], opts:[{t:'"What do we know about Aldoret?"', go:'b'},{t:'"Any other trouble?"', go:'c'},{t:'Leave.', end:true}]},
            b:{speaker:'Sir Maren Holt', text:'"The cult holds the gate with fire-demons. Behind that, babau in the keep. And in the chapel, whatever took the Standard. If you had the old engineer\'s plans, you might find the sapper\'s tunnel they dug in the first siege. Candleridge had a copy, before it fell."', fx:[{flag:'hint_plans'}], opts:[{t:'"Any other trouble?"', go:'c'},{t:'Leave.', end:true}]},
            c:{speaker:'Sir Maren Holt', text:'"Deserters from the first march are hiding in a hollow east of here. Two dozen of them. I\'d rather have them back in the line than rotting in a ditch. And Fort Candleridge went silent a month ago."', fx:[{quest:['q_deserters',1]},{quest:['q_candle',1]}], opts:[{t:'Leave.', end:true}]}}}},
        {id:'dunmar', type:'merchant', name:'Dunmar Ironside, Armorer', x:.20, y:.40, merchant:{id:'dunmar', types:['smith','armorer']}},
        {id:'orlessa', type:'merchant', name:"Orlessa's Curios", x:.78, y:.36, merchant:{id:'orlessa', types:['arcanist'], uniques:['hunterCoat','pilgrimStaff']}},
        {id:'hosp', type:'merchant', name:'Field Hospital', x:.64, y:.70, merchant:{id:'hosp', types:['alchemist'], supplies:true}},
        {id:'inn', type:'inn', name:'Officers\' Tents', x:.36, y:.72, text:'A cot, a brazier and a guard at the tent flap. Luxury.'},
        {id:'board', type:'board', name:'Sellswords', x:.14, y:.78},
      ]},
    {id:'road', name:'The Broken Road', kind:'site', biome:'waste', x:.26, y:.50, links:['kf','candle','ravine','gate'],
      desc:'The old imperial road, cracked by the rift\'s tremors. A dwarf holds the toll bridge alone.',
      pois:[
        {id:'bridge', type:'battle', name:'The Toll Bridge', x:.50, y:.50,
          text:'Hounds made of smoke and embers circle a dwarf on the bridge. Cultists wait on the far bank with crossbows.',

// ============================================================
//  CHARACTER ENGINE — creation, derived stats, leveling
// ============================================================
const mod = s => Math.floor((s-10)/2);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let RNG = Math.random;
const d = n => 1+Math.floor(RNG()*n);
const roll = (n,die,b=0)=>{ let t=b; for(let i=0;i<n;i++) t+=d(die); return t; };
const fmtMod = v => (v>=0?'+':'')+v;
let _uidSeq = 1;
const newUid = p => p+(_uidSeq++)+'_'+Math.floor(Math.random()*1e6).toString(36);

function babFor(prog, lvl){ return prog==='full'?lvl : prog==='med'?Math.floor(lvl*3/4) : Math.floor(lvl/2); }
function baseSave(good, lvl){ return good? 2+Math.floor(lvl/2) : Math.floor(lvl/3); }
function casterLevel(c){ const C=CLASSES[c.cls]; if(!C.cast) return 0; return C.casterStart===4? Math.max(0,c.level-3) : c.level; }
function slotTable(c){ const C=CLASSES[c.cls]; if(!C.cast) return null; if(C.casterStart===4) return SLOTS.half; if(C.spont) return SLOTS.spont; return SLOTS.full; }
function hasMythic(c,id){ return !!(c.mythic && c.mythic.abilities.includes(id)); }
function tierOf(c){ return c.mythic? c.mythic.tier : 0; }
